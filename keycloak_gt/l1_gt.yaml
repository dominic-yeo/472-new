excluded_items:
- item: '{realm} is a path template -- one node per route, not per realm. The whole protocol + admin + account surface is
    replicated under every realm (master + each created realm)'
  reason: Keycloak dispatches every realm through the same RealmsResource + resource tree; the GT models each route once with
    {realm} as a parameter. Realms differ only in config, not in the route/auth model.
- item: The deep admin sub-resource tree is enumerated at the resource ROOT + security-critical sub-paths; the full per-item
    CRUD leaf set (e.g. every roles/{role}/composites, clients/{id}/nodes, client-scopes/{id}/scope-mappings/*, group hierarchy
    leaves) is summarized, not expanded
  reason: Hundreds of admin leaves share the identical realm-management-role authorization; the roots + the high-value leaves
    (impersonation, credentials, client-secret, service-account, SSRF test endpoints) are L2-covered and the rest enumerated
    as L1 nodes.
- item: Theme/static assets, the Admin Console SPA (/admin/{realm}/console), the Account Console SPA, welcome page resources,
    and JS adapter resources
  reason: Client assets; the OIDC + REST APIs they drive are the modeled surface.
- item: SAML protocol internals beyond the endpoint + descriptor (artifact resolution, ECP, SOAP binding details) and the
    WS-Fed/Docker/CIBA-channel protocol variants
  reason: Protocol-specific message handling reusing the same realm/client model; the SAML endpoint + metadata and the OIDC
    core are modeled, the variants enumerated.
- item: 'The separate management port (9000): /health, /health/ready|live, /metrics'
  reason: A distinct bind on a different port (KC_HTTP_MANAGEMENT_PORT), not part of the 8080 request surface; enumerated
    as out-of-scope for this origin.
