- id: gt-action-005
  name: Token request
  kind: normal
  description: A client exchanges credentials/code/refresh for access + refresh tokens.
  action_key: oidc_token
  subject:
    id: actor
    identity: ClientApp
    role: OAuthClient
    auth_context: ClientCredentials
  operation:
    business: oidc_token
    crud: Create
  object:
    kind: state
    id: session
    type: Session
    name: Session
    entity: Session
    role: created
    attribute: ''
    state_field: access_token
    binding:
      source: response
      field: ''
      resource: AccessToken(session)
    participants: []
    constraints: []
  requirements:
  - type: authentication
    fact:
      predicate: Authenticated
      arguments:
      - *id001
      - ClientCredentials
    reason: Confidential client authenticates (secret/assertion/mTLS); public clients use PKCE.
  - type: knowledge
    fact:
      predicate: Know
      arguments:
      - *id001
      - kind: reference
        type: AuthCode
        target:
          kind: entity
          id: session
          type: Session
          role: created
    reason: Presents a code / password / refresh / subject_token per grant.
  effects:
    gen:
    - fact:
        predicate: Know
        arguments:
        - *id001
        - kind: reference
          type: AccessToken
          target:
            kind: entity
            id: session
            type: Session
            role: created
      basis: io_reference
      reason: Issues an access token (JWT).
    - fact:
        predicate: Know
        arguments:
        - *id001
        - kind: reference
          type: RefreshToken
          target:
            kind: entity
            id: session
            type: Session
            role: created
      basis: io_reference
      reason: Issues a refresh token.
    - fact:
        predicate: Authenticated
        arguments:
        - *id001
        - AccessToken
      basis: auth_transition
      reason: Bearer becomes authenticated for the audience.
    kill: []
  io_accounting:
  - direction: input
    field: code / AuthCode(session)
    disposition: req
    facts:
    - Know(actor:User[SELF],AuthCode(session:Session{created}))
    ignored_reason: ''
  - direction: input
    field: client_secret / ClientSecret(client)
    disposition: object_attribute
    facts: []
    ignored_reason: Client auth.
  - direction: output
    field: access_token / AccessToken(session)
    disposition: gen
    facts:
    - Know(actor:User[SELF],AccessToken(session:Session{created}))
    ignored_reason: ''
  - direction: output
    field: refresh_token / RefreshToken(session)
    disposition: gen
    facts:
    - Know(actor:User[SELF],RefreshToken(session:Session{created}))
    ignored_reason: ''
  l1_bindings:
  - l1_key: http://localhost:8080/realms/{realm}/protocol/openid-connect/token
    methods:
    - POST
    selector:
      field: method
      values:
      - POST
  confidence: 0.9
  reasoning: token endpoint mints tokens for every grant.
  l1_keys:
  - http://localhost:8080/realms/{realm}/protocol/openid-connect/token
  consumes:
  - Authenticated(actor:User[SELF],ClientCredentials)
  - Know(actor:User[SELF],AuthCode(session:Session{created}))
  produces:
  - Know(actor:User[SELF],AccessToken(session:Session{created}))
  - Know(actor:User[SELF],RefreshToken(session:Session{created}))
  - Authenticated(actor:User[SELF],AccessToken)
  object_type: state
  lifecycle: ''
  operations: []
  secondary_objects: []
  gt:
    visibility:
      minimum: black_box
      reason: Token endpoint.
    black_box_reachable: true
    reachability_conditions:
    - 'All grants: code / refresh / password (brute-force) / client_credentials / token-exchange (delegation-escalation) /
      device / ciba / uma-ticket.'
    observable_evidence: []
    evidence:
    - type: source
      ref: keycloak/services/src/main/java/org/keycloak/protocol/oidc/endpoints/TokenEndpoint.java
      supports: JAX-RS resource + handler
    - type: runtime
      ref: '2026-11-19: underlying L1 interface(s) observed at runtime (/realms/{realm}/protocol/openid-connect/token)'
      supports: 'runtime: bound interface observed per identity; action effect inferred from interface (interface-observed,
        not effect-observed)'
    notes: token-exchange is the high-risk delegation/escalation grant.
