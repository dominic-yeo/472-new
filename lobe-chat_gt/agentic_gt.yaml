schema_version: agentic-attack-surface-v1
environment_id: lobechat-oss
meta:
  app: lobe-chat
  app_version: repo @ 472-new checkout
  git_ref: see source_root
  applicability:
    verdict: qualifies
    evidence: client tool-call loop (store/chat/slices/plugin/action.ts triggerToolCalls) over builtin/plugin/custom tools;
      plugin calls proxied through the server gateway (services/chat.ts runPluginApi).
  phase_status:
    static_A_to_D: complete
    runtime_E: pending (no live grounding yet)
    link_F: partial (L1/L2 GT for lobe-chat not yet built; ids are forward refs)
agents:
- id: agent.lobechat.assistant
  name: Assistant (agent session)
  component: lobe-chat
  agent_kind: interactive
  purpose: Per-session assistant defined by an agent config (systemRole + enabled plugins/model); runs a client tool-call
    loop, dispatching plugin calls through the server gateway.
  invocation_surfaces:
  - l1_id: l1.api.chat.completion
    trigger: chat send -> model stream; tool_calls dispatched client-side
    auth_context: user session (self-host single-user, or next-auth/Clerk multi-user)
  - l1_id: l1.api.plugin.gateway
    trigger: runPluginApi -> gateway proxy to plugin manifest url
    auth_context: same user; plugin settings in headers
  model_config:
    provider: configurable (OpenAI/Anthropic/Ollama/... many)
    model: per-agent model
    config_source: agent/session config + user settings
    writers:
    - principal: user
      l1_id: l1.api.agent.config
    evidence_status: source_confirmed
  instruction_sources:
  - surface_id: ctx.system_role
    instruction_role: system
    precedence: base
    config_version: runtime
    writers:
    - principal: user
      l1_id: l1.api.agent.config
    - principal: external_service
      l1_id: l1.api.market.install
  tool_binding_ids:
  - tool.dalle
  - tool.web_browsing
  - tool.plugin_default
  - tool.plugin_standalone
  - tool.custom_plugin
  context_source_ids:
  - ctx.system_role
  - ctx.user_message
  - ctx.chat_history
  - ctx.knowledge
  - ctx.tool_results
  - ctx.web_content
  - ctx.plugin_manifest_desc
  - ctx.file_attachments
  memory_ids:
  - mem.messages
  - mem.knowledge_vector
  - mem.agents
  output_sink_ids:
  - sink.chat_response
  - sink.artifacts
  - sink.plugin_gateway
  - sink.dalle
  control_ids:
  - ctl.plugin_enablement
  - ctl.gateway_proxy
  - ctl.plugin_settings_auth
  - ctl.abort
  resource_limits:
    max_iterations: tool-call loop continues while the model emits tool_calls; no explicit hard cap found in web source
    recursion: n/a
    token_or_cost_budget: none in core
    loop_detection: user abort / stream cancel
    enforced_by: code
  authority_context:
    principal_source: user session (or local single-user)
    tenant_scope: per-user agents/sessions/files
    resource_scope: user's sessions + plugin settings secrets
    delegated_identity: plugin calls carry the user's plugin-settings headers via the gateway
    authz_enforcement: code (per-user data scoping); plugins auto-run without approval
  related_l2_ids:
  - l2.chat.agent_session
  visibility: white_box_required
  reachability:
    status: black_box_reachable
    notes: ''
  source_ref: src/store/chat/slices/plugin/action.ts; src/services/chat.ts runPluginApi; src/tools/index.ts
  evidence_status: source_confirmed
  notes: Agent config (systemRole + plugins) can be installed from the plugin/agent MARKET -> external authorship of the system
    prompt and tool set.
  runtime_blocker: crypto_blocked
