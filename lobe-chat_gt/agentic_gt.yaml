  notes: Server gateway mediates plugin calls and attaches auth; also the SSRF sink (fetches manifest url).
  runtime_blocker: crypto_blocked
- id: ctl.plugin_settings_auth
  control_kind: authorization
  applies_at: before_tool
  enforcement_mode: modifying
