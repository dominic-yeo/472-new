    black_box_reachable: true
    reachability_conditions:
    - Local login enabled (check_local_login_allowed)
    - Not SSO-only
    evidence:
    - type: source
      ref: app/controllers/session_controller.rb:362
      supports: POST /session require(:login,:password); confirm_password?; login(user)
    - type: source
      ref: app/controllers/session_controller.rb:13
      supports: rate_limit_login before_action
    - type: runtime
      ref: '2026-11-20 probe (admin auth, mutations driven): anonymous POST->403; admin POST->400'
      supports: 'runtime: handler reached incl. mutating methods'
    notes: Auth boundary. Rate-limited per-IP and per-account; enforces approval, activation, password expiry and second factor.
      Generic invalid_credentials (no user enumeration on the password check).
