- key: http://localhost/session
  kind: api
  methods:
  - POST
  statuses:
  - 200
  - 400
  - 403
  - 429
  content_types:
  - application/json
  params: []
  inputs: &id003
  - login
  - password
  - second_factor_token
  outputs:
  - user
  input_spec:
    format: json
    fields: *id003
  io_variants:
  - method: POST
    content_types:
    - application/json
    inputs:
    - login
    - password
    - second_factor_token
    outputs:
    - user
    input: {}
    request:
      body_format: json
      body_example:
        login: alice
        password: '***'
        second_factor_token: '123456'
        second_factor_method: 1
      fields:
      - name: login
        location: body
        path: ''
        type: string
        required: true
        flow: true
        description: Username or email (find_by_username_or_email).
      - name: password
        location: body
        path: ''
        type: string
        required: true
        flow: true
        description: Account password (confirm_password?).
      - name: second_factor_token
        location: body
        path: ''
        type: string
        required: false
        flow: true
        description: TOTP/backup 2FA token when 2FA is enabled.
      - name: second_factor_method
        location: body
        path: ''
        type: integer
        required: false
        flow: false
        description: 2FA method selector (TOTP/backup/security key).
    response:
      format: json
      scalar_type: null
      value_name: null
      value_type: null
      value_flow: false
      value_description: null
      fields:
      - name: user
        path: user
        type: object
        flow: true
        description: Serialized logged-in user (session cookie set).
      - name: error
        path: error
        type: string
        flow: false
        description: Error/reason on failure (invalid/expired/not_approved).
    reason: 'Password login: verifies credentials, enforces approval/activation + 2FA, establishes session.'
    evidence: app/controllers/session_controller.rb:362
  operation_semantic: password_login
  semantic_inputs:
  - LoginName(identity)
  - Password(credential)
  - SecondFactorToken(credential)
  semantic_outputs:
  - UserProfile(identity)
  semantic_input_decisions:
  - &id009
    raw_field: login
    resource: LoginName(identity)
    mergeable: true
    value_kind: identifier
    reference_capable: true
    reference_fields:
