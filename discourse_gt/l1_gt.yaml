    resource: SecondFactorToken(credential)
    mergeable: true
    value_kind: credential
    reference_capable: false
    reference_fields: []
    reason: second_factor_token denotes SecondFactorToken(credential).
  semantic_output_decisions:
  - raw_field: user
    resource: UserProfile(identity)
    mergeable: true
    value_kind: content
    reference_capable: false
    reference_fields: []
    reason: Authenticated user's serialized profile returned on success.
