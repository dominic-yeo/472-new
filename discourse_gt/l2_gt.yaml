- id: gt-action-003
  name: Log in with password
  kind: normal
  description: An anonymous caller authenticates with username/email + password (and 2FA) to open a session.
  action_key: disc_password_login
  subject:
    id: actor
    identity: Anonymous
    role: Public
    auth_context: None
  operation:
    business: password_login
    crud: Create
  object:
    kind: state
    id: session
    type: Session
    name: Session
    entity: Session
    role: target
    attribute: ''
    state_field: ''
    binding:
      source: request
      field: login
      resource: LoginName(identity)
    participants:
    - id: self
      type: User
      role: target
      binding: {}
    constraints: []
  requirements:
  - type: knowledge
    fact:
      predicate: Know
      arguments:
      - *id001
      - kind: reference
        type: Password
        target: &id003
          kind: entity
          id: self
          type: User
          role: target
    reason: Caller must present login + matching password (confirm_password?).
  effects:
    gen:
    - fact: &id006
        predicate: Authenticated
        arguments:
        - *id001
        - Session
      basis: auth_transition
      reason: A session is established on valid credentials + 2FA.
    - fact: &id005
        predicate: Know
        arguments:
        - *id001
        - kind: reference
          type: UserProfile
          target: *id003
      basis: io_reference
      reason: Response returns the serialized logged-in user.
    kill: []
  io_accounting:
  - direction: input
    field: login / LoginName(identity)
    disposition: object_attribute
    facts: []
    ignored_reason: Username or email.
  - direction: input
    field: password / Password(credential)
    disposition: object_attribute
    facts: []
    ignored_reason: Account password.
  - direction: input
    field: second_factor_token / SecondFactorToken(credential)
    disposition: object_attribute
    facts: []
    ignored_reason: 2FA token when enabled.
  - direction: output
    field: user / UserProfile(identity)
    disposition: gen
    facts:
    - Know(actor:User[SELF],UserProfile(self:User{target}))
    ignored_reason: ''
  l1_bindings:
  - l1_key: http://localhost/session
    methods:
    - POST
    selector:
      field: ''
      values: []
  confidence: 0.95
  reasoning: Credential + 2FA auth boundary; rate-limited.
  l1_keys:
  - http://localhost/session
  consumes:
  - Know(actor:User[SELF],Password(self:User{target}))
  produces:
  - Authenticated(actor:User[SELF],Session)
  - Know(actor:User[SELF],UserProfile(self:User{target}))
  object_type: state
  lifecycle: ''
  operations: []
  secondary_objects: []
  gt:
    visibility:
      minimum: black_box
      reason: Primary unauthenticated login boundary.
    black_box_reachable: true
    reachability_conditions:
    - Local login enabled
    - Not SSO-only
    observable_evidence: []
    evidence:
    - type: source
      ref: app/controllers/session_controller.rb:362
      supports: POST /session confirm_password?; login(user)
    - type: source
      ref: app/controllers/session_controller.rb:13
      supports: rate_limit_login
    - type: runtime
      ref: '2026-11-20: bound L1 interface(s) observed at runtime (/session)'
      supports: 'runtime: bound interface observed per identity (Api-Key admin + anon); interface-observed'
    notes: Rate-limited per IP and per account; enforces approval/activation/password-expiry/2FA. Generic invalid_credentials
      avoids user enumeration on the password check.
    grounding:
      tier: interface
      bindings: 1
- id: gt-action-004
  name: Log out
  kind: normal
  description: A signed-in user ends their session; return_url is validated against open-redirect.
  action_key: disc_logout
  subject:
    id: actor
    identity: AuthenticatedUser
    role: Member
    auth_context: Session
  operation:
    business: logout
    crud: Delete
  object:
    kind: state
    id: session
    type: Session
    name: Session
    entity: Session
    role: target
    attribute: ''
    state_field: ''
    binding:
      source: path
      field: id
      resource: Username(identity)
    participants: []
    constraints: []
  requirements:
  - &id004
    type: authentication
    fact:
      predicate: Authenticated
      arguments:
      - *id001
      - Session
    reason: current_user must be present (signed-in session or API key).
  effects:
    gen: []
    kill:
    - fact:
        predicate: Authenticated
        arguments:
        - *id001
        - Session
      basis: auth_transition
      reason: The current session is reset (logged out).
  io_accounting: []
  l1_bindings:
  - l1_key: http://localhost/session/{id}
    methods:
    - DELETE
    selector:
      field: ''
      values: []
  confidence: 0.95
  reasoning: Session teardown.
  l1_keys:
  - http://localhost/session/{id}
  consumes:
  - Authenticated(actor:User[SELF],Session)
  produces: []
  object_type: state
  lifecycle: ''
  operations: []
  secondary_objects: []
  gt:
    visibility:
      minimum: black_box
      reason: Requires an active session.
    black_box_reachable: true
    reachability_conditions: []
    observable_evidence: []
    evidence:
    - type: source
      ref: app/controllers/session_controller.rb:785
      supports: DELETE /session/:id -> reset_session
    - type: runtime
      ref: '2026-11-20: underlying L1 interface(s) observed at runtime (/session/{id})'
      supports: 'runtime: bound interface observed per identity; action effect inferred from interface (interface-observed,
        not effect-observed)'
    notes: Optionally detaches a web-push subscription.
    grounding:
      tier: interface
      bindings: 1
