schema_version: pengent-web-gt-v1
environment_id: discourse-local
scope: 'Discourse 2026.11 HTTP API -- module: Session + Authentication (SessionController)'
nodes:
- id: gt-action-001
  name: Get CSRF token
  kind: normal
  description: Any caller fetches the per-session CSRF token used to authorize mutations.
  action_key: disc_get_csrf
  subject:
    id: actor
    identity: Anonymous
    role: Public
    auth_context: None
  operation:
    business: get_csrf_token
    crud: Read
  object:
    kind: entity
    id: session
    type: Session
    name: Session
    entity: Session
    role: target
    attribute: ''
    state_field: ''
    binding:
      source: implicit
      field: ''
      resource: ''
    participants: []
    constraints: []
  requirements: []
  effects:
    gen:
    - fact:
        predicate: Know
        arguments:
        - &id001
          kind: subject
          id: actor
          type: User
          relative_role: SELF
        - kind: reference
          type: CsrfToken
          target: &id002
            kind: entity
            id: session
            type: Session
            role: target
      basis: io_reference
      reason: Response returns the session CSRF token.
    kill: []
  io_accounting:
  - direction: output
    field: csrf / CsrfToken(credential)
    disposition: gen
    facts:
    - Know(actor:User[SELF],CsrfToken(session:Session{target}))
    ignored_reason: ''
  l1_bindings:
  - l1_key: http://localhost/session/csrf
    methods:
    - GET
    selector:
      field: ''
      values: []
  confidence: 0.95
  reasoning: Hands out the CSRF token for later mutations.
  l1_keys:
  - http://localhost/session/csrf
  consumes: []
  produces:
  - Know(actor:User[SELF],CsrfToken(session:Session{target}))
  object_type: entity
  lifecycle: ''
  operations: []
  secondary_objects: []
  gt:
    visibility:
      minimum: black_box
      reason: Unauthenticated SPA bootstrap.
    black_box_reachable: true
    reachability_conditions: []
    observable_evidence: []
    evidence:
    - type: source
      ref: app/controllers/session_controller.rb:50
      supports: GET /session/csrf -> {csrf}
    - type: runtime
      ref: '2026-11-20: effect observed via GET /session/csrf -> 200 (anonymous)'
      supports: 'runtime: bound interface returned 200 to GET /session/csrf (identity=anonymous) -> representation returned
        to caller; effect realized and observed (effect-observed)'
    notes: null
    grounding:
      tier: effect
      bindings: 1
