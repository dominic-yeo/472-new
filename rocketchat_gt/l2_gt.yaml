schema_version: pengent-web-gt-v1
environment_id: rocketchat-oss
nodes:
- id: gt-action-001
  name: Log in
  kind: normal
  description: A visitor authenticates and receives an auth token.
  action_key: login
  subject:
    id: actor
    identity: Anonymous
    role: Guest
    auth_context: Anonymous
  operation:
    business: login_user
    crud: Create
  object:
    kind: state
    id: session
    type: Session
    name: Session
    entity: Session
    role: created
    attribute: ''
    state_field: authenticated
    binding:
      source: response
      field: ''
      resource: AuthToken(session)
    participants:
    - id: user
      type: User
      role: self
      binding: {}
    constraints: []
  requirements:
  - type: knowledge
    fact: &id003
      predicate: Know
      arguments:
      - &id001
        kind: subject
        id: actor
        type: User
        relative_role: SELF
      - kind: reference
        type: Password
        target:
          kind: entity
          id: user
          type: User
          role: self
    reason: Caller supplies username/email + password.
  effects:
    gen:
    - fact:
        predicate: Authenticated
        arguments:
        - *id001
        - AuthToken
      basis: auth_transition
      reason: Caller becomes authenticated.
    - fact:
        predicate: Know
        arguments:
        - *id001
        - kind: reference
          type: AuthToken
          target:
            kind: entity
            id: session
            type: Session
            role: created
      basis: io_reference
      reason: Returns the X-Auth-Token + userId.
    kill: []
  io_accounting:
  - direction: input
    field: user / Username(user)
    disposition: object_attribute
    facts: []
    ignored_reason: Login identifier.
  - direction: input
    field: password / Password(user)
    disposition: req
    facts:
    - Know(actor:User[SELF],Password(user:User{self}))
    ignored_reason: ''
  - direction: output
    field: authToken / AuthToken(session)
    disposition: gen
    facts:
    - Know(actor:User[SELF],AuthToken(session:Session{created}))
    ignored_reason: ''
  l1_bindings:
  - l1_key: http://localhost:3000/api/v1/login
    methods:
    - POST
    selector:
      field: ''
      values: []
  confidence: 0.9
  reasoning: login returns an auth token + userId.
  l1_keys:
  - http://localhost:3000/api/v1/login
  consumes:
  - Know(actor:User[SELF],Password(user:User{self}))
  produces:
  - Authenticated(actor:User[SELF],AuthToken)
  - Know(actor:User[SELF],AuthToken(session:Session{created}))
  object_type: state
  lifecycle: ''
  operations: []
  secondary_objects: []
  gt:
    visibility:
      minimum: black_box
      reason: Public login.
    black_box_reachable: true
    reachability_conditions:
    - Public (authRequired:false). Brute-force / credential-stuffing; X-2fa-code for 2FA.
    observable_evidence: []
    evidence:
    - type: source
      ref: apps/meteor/server/api/v1/../ApiClass.ts
      supports: login
    - type: runtime
      ref: '2026-11-20: effect observed via POST /api/v1/login -> 200 (anon)'
      supports: 'runtime: bound interface returned 200 to POST /api/v1/login (identity=anon) -> resource created; server returned
        it; effect realized and observed (effect-observed)'
    notes: null
    grounding:
      tier: effect
      bindings: 1
