schema_version: agentic-attack-surface-v1
environment_id: librechat-oss
meta:
  app: LibreChat
  app_version: repo @ 472-new checkout
  git_ref: see source_root
  applicability:
    verdict: qualifies
    evidence: 'Agents endpoint: @librechat/agents LangGraph run (Runs/StreamRunManager.js, createRunBody.js)
      over ToolService.loadAgentTools; MCP + OpenAPI Actions + sub-agents.'
  phase_status:
    static_A_to_D: complete
    runtime_E: pending (no live grounding yet)
    link_F: partial (L1/L2 GT for LibreChat not yet built; ids are forward refs)
agents:
- id: agent.librechat.primary
  name: Agent (Agents endpoint)
  component: LibreChat
  agent_kind: interactive
  purpose: User-configured agent run over a LangGraph loop; tools gated by AgentCapabilities; can call
    MCP servers, OpenAPI Actions, and sub-agents.
  invocation_surfaces:
  - l1_id: l1.api.agents.chat
    trigger: POST agents chat (EModelEndpoint.agents) run
    auth_context: session JWT -> req.user; agent access + tool role grants
  model_config:
    provider: any configured endpoint (OpenAI/Anthropic/Bedrock/Google/custom)
    model: agent model_parameters
    config_source: agent definition + librechat.yaml
    writers:
    - principal: agent_author
      l1_id: l1.api.agents.update
    - principal: admin
      l1_id: l1.config.librechat_yaml
    evidence_status: source_confirmed
  instruction_sources:
  - surface_id: ctx.system_prompt
    instruction_role: system
    precedence: base
    config_version: runtime
    writers:
    - principal: agent_author
      l1_id: l1.api.agents.update
  tool_binding_ids:
  - tool.execute_code
  - tool.file_search
  - tool.web_search
  - tool.image_gen
  - tool.memory
  - tool.mcp
  - tool.actions
  - tool.plugins
  - tool.subagent
  context_source_ids:
  - ctx.system_prompt
  - ctx.user_message
  - ctx.chat_history
  - ctx.file_search_rag
  - ctx.tool_results
  - ctx.web_content
  - ctx.memory_recall
  - ctx.ocr_context
  - ctx.tool_descriptions
  - ctx.attachments
  memory_ids:
  - mem.conversations
  - mem.vectordb
  - mem.agent_memory
  - mem.agents_config
  - mem.actions
  output_sink_ids:
  - sink.chat_response
  - sink.artifacts
  - sink.code_exec
  - sink.image
  - sink.action_call
  - sink.mcp_call
  - sink.web_fetch
  control_ids:
  - ctl.agent_capabilities
  - ctl.tool_role_grants
  - ctl.code_sandbox
  - ctl.mcp_oauth
  - ctl.action_auth
  - ctl.abort
  resource_limits:
    max_iterations: LangGraph recursion/step limit (agent run)
    recursion: sub-agents bounded by routing config
    token_or_cost_budget: token limits per agent
    loop_detection: graph recursionLimit
    enforced_by: code
  authority_context:
    principal_source: session JWT -> req.user
    tenant_scope: per-user; shared agents by permission
    resource_scope: user's files/memories; agent's actions/MCP
    delegated_identity: MCP/Actions use PER-USER OAuth/OBO identity (AuthIdentityContext); Actions may
      also use stored apiKey auth
    authz_enforcement: code (AgentCapabilities + resolveToolRoleGrants + per-tool auth)
  related_l2_ids:
  - l2.agents.chat
  visibility: white_box_required
  reachability:
    status: black_box_reachable
    notes: ''
  source_ref: api/server/services/ToolService.js loadAgentTools; createRunBody.js; Runs/StreamRunManager.js
  evidence_status: observed
  notes: 'Tool set = native capability tools + agent.tools (plugins) + agent actions + MCP servers, each
    gated by AgentCapabilities and tool role grants | RUNTIME 2026-11-20: observed via LibreChat server-side
    agent on local qwen2.5:7b (Ollama endpoint). Agent ran + persisted conversations; natively invoked
    execute_code (bash_tool) and web_search (tool_call/run_step SSE events on /api/agents/chat/stream/{streamId}).'
- id: agent.librechat.subagent
  name: Sub-agent (delegated)
  component: LibreChat
  agent_kind: specialist
  purpose: Delegated agent/graph run spawned by a parent agent; identity captured as subagentIdentity.
  invocation_surfaces:
  - l1_id: l1.internal.subagent
    trigger: parent agent delegation (chain capability)
    auth_context: parent run's user identity
  model_config:
    provider: sub-agent's own definition
    model: sub-agent model
    config_source: agent definition
    writers:
    - principal: agent_author
      l1_id: l1.api.agents.update
    evidence_status: source_confirmed
  instruction_sources:
  - surface_id: ctx.system_prompt
    instruction_role: system
    precedence: base
    config_version: runtime
    writers:
    - principal: agent_author
      l1_id: l1.api.agents.update
  - surface_id: ctx.delegated_task
    instruction_role: developer
    precedence: base
    config_version: runtime
    writers:
    - principal: agent.librechat.primary
      l1_id: null
  tool_binding_ids:
  - tool.execute_code
  - tool.file_search
  - tool.web_search
  - tool.mcp
  - tool.actions
  context_source_ids:
  - ctx.system_prompt
  - ctx.delegated_task
  - ctx.tool_results
  - ctx.file_search_rag
  - ctx.web_content
  memory_ids:
  - mem.conversations
  - mem.vectordb
  output_sink_ids:
  - sink.delegated_result
  - sink.action_call
  - sink.mcp_call
  control_ids:
  - ctl.agent_capabilities
  - ctl.subagent_routing
  - ctl.tool_role_grants
  resource_limits:
    max_iterations: graph recursionLimit
    recursion: routing bounds nesting
    token_or_cost_budget: per sub-agent
    loop_detection: graph limit
    enforced_by: code
  authority_context:
    principal_source: inherits parent user
    tenant_scope: same user
    resource_scope: sub-agent's tools/actions
    delegated_identity: subagentIdentity (subagentKind agent|graph + subagentAgentId); per-user OBO
    authz_enforcement: code (capabilities + routing)
  related_l2_ids:
  - l2.agents.chat
  visibility: white_box_required
  reachability:
    status: black_box_reachable
    notes: ''
  source_ref: packages/api/src/agents/{subagentIdentity,subagentTaskRouting,subagentDelivery}.ts
  evidence_status: source_confirmed
  notes: Child content + identity buffered and delivered back to the parent (subagentContent/Delivery).
- id: agent.librechat.memory
  name: Memory agent
  component: LibreChat
  agent_kind: reviewer
  purpose: Background agent that extracts/updates long-term memory from conversation turns.
  invocation_surfaces:
  - l1_id: l1.internal.memory
    trigger: post-turn memory processing (memory capability)
    auth_context: turn user
  model_config:
    provider: configured memory model
    model: memory agent model
    config_source: librechat.yaml memory
    writers:
    - principal: admin
      l1_id: l1.config.librechat_yaml
    evidence_status: source_confirmed
  instruction_sources:
  - surface_id: ctx.memory_prompt
    instruction_role: system
    precedence: base
    config_version: runtime
    writers:
    - principal: admin
      l1_id: l1.config.librechat_yaml
  tool_binding_ids:
  - tool.memory
  context_source_ids:
  - ctx.user_message
  - ctx.chat_history
  - ctx.memory_prompt
  memory_ids:
  - mem.agent_memory
  output_sink_ids:
  - sink.memory_write
  control_ids:
  - ctl.agent_capabilities
  resource_limits: null
  authority_context:
    principal_source: turn user
    tenant_scope: same user
    resource_scope: user's memories
    delegated_identity: runs as the user
    authz_enforcement: code (memory capability + token limits)
  related_l2_ids:
  - l2.agents.chat
  visibility: white_box_required
  reachability:
    status: black_box_reachable
    notes: ''
  source_ref: packages/api memory processing; Tools memory
  evidence_status: source_confirmed
  notes: Turn-derived memory extraction -> poisoning persistence into ctx.memory_recall.
