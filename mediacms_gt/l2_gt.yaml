      source: request
      field: friendly_token
      resource: MediaToken(media)
    participants: []
    constraints: []
  requirements:
  - type: authentication
    fact: *id004
    reason: Authenticated session/token.
  - type: knowledge
    fact: *id003
    reason: Target media token.
  - type: existence
    fact: *id005
    reason: Target must exist.
  - type: authorization
    fact:
      predicate: Can
      arguments:
      - *id001
      - Update
      - *id002
    reason: Owner, media contributor, or editor only.
  effects:
    gen:
    - fact:
        predicate: State
        arguments:
        - *id002
        - title
        - updated
      basis: state_transition
      reason: Title/description replaced.
    - fact:
        predicate: State
        arguments:
        - *id002
        - description
        - updated
      basis: state_transition
      reason: Description replaced.
    kill:
    - fact:
        predicate: State
        arguments:
        - *id002
        - title
        - previous
      basis: state_transition
      reason: Previous title no longer holds.
