schema_version: pengent-web-gt-v1
environment_id: mediacms-9.2.1
nodes:
- id: gt-action-001
  name: List media
  kind: normal
  description: A visitor lists media the identity is allowed to see.
  action_key: user_list_media
  subject:
    id: actor
    identity: CurrentUser
    role: User
    auth_context: Session
  operation:
    business: list_media
    crud: Read
  object:
    kind: entity
    id: media
    type: Media
    name: Media
    entity: Media
    role: collection
    attribute: ''
    state_field: ''
    binding:
      source: implicit
      field: ''
      resource: MediaToken(media)
    participants: []
    constraints: []
  requirements: []
  effects:
    gen:
    - fact: &id003
        predicate: Know
        arguments:
        - &id001
          kind: subject
          id: actor
          type: User
          relative_role: SELF
        - kind: reference
          type: MediaToken
          target: &id002
            kind: entity
            id: media
            type: Media
            role: target
      basis: io_reference
      reason: Response returns friendly_token references for listed media.
    kill: []
  io_accounting:
  - direction: output
    field: friendly_token / MediaToken(media)
    disposition: gen
    facts:
    - Know(actor:User[SELF],MediaToken(media:Media{target}))
    ignored_reason: ''
  - direction: output
    field: title / MediaTitle(media)
    disposition: observed_only
    facts: []
    ignored_reason: Display attribute; not a reference.
  - direction: input
    field: author / Username(user)
    disposition: object_attribute
    facts: []
    ignored_reason: Filter only; not a precondition fact.
  l1_bindings:
  - l1_key: http://localhost/api/v1/media
    methods:
    - GET
    selector:
      field: ''
      values: []
  confidence: 0.95
  reasoning: List endpoint; read semantics confirmed by source + runtime.
  l1_keys:
  - http://localhost/api/v1/media
  consumes: []
  produces:
  - Know(actor:User[SELF],MediaToken(media:Media{target}))
  object_type: entity
  lifecycle: ''
  operations: []
  secondary_objects: []
  gt:
    visibility:
      minimum: black_box
      reason: Home/listing pages fetch this.
    black_box_reachable: true
    reachability_conditions:
    - Public read; scope widens with session.
    observable_evidence: []
    evidence:
    - type: runtime
      ref: mediacms_gt/runtime_probe.txt
      supports: GET 200 all identities
    notes: null
- id: gt-action-002
  name: Upload media
  kind: normal
  description: An authenticated user uploads a new media item.
  action_key: user_create_media
  subject:
    id: actor
    identity: CurrentUser
    role: User
    auth_context: Session
  operation:
    business: upload_media
    crud: Create
  object:
    kind: entity
    id: media
    type: Media
    name: Media
    entity: Media
    role: created
    attribute: ''
    state_field: ''
    binding:
      source: response
      field: friendly_token
      resource: MediaToken(media)
    participants: []
    constraints: []
  requirements:
  - type: authentication
    fact: &id004
      predicate: Authenticated
      arguments:
      - *id001
      - Session
    reason: IsAuthorizedToAdd requires an authenticated uploader.
  - type: authorization
    fact:
      predicate: Can
      arguments:
      - *id001
      - Create
      - *id002
    reason: Upload permission (CAN_ADD_MEDIA / quota).
  effects:
    gen:
    - fact:
        predicate: Exists
        arguments:
        - kind: entity
          id: media
          type: Media
          role: created
      basis: action_semantics
      reason: A new Media row is created.
    - fact:
        predicate: Know
        arguments:
        - *id001
        - kind: reference
          type: MediaToken
          target:
            kind: entity
            id: media
            type: Media
            role: created
      basis: io_reference
      reason: Response returns the created media's friendly_token.
    kill: []
  io_accounting:
  - direction: input
    field: media_file / MediaFile(media)
    disposition: object_attribute
    facts: []
    ignored_reason: New uploaded content, not a precondition.
  - direction: input
    field: title / MediaTitle(media)
    disposition: object_attribute
    facts: []
    ignored_reason: New content attribute.
  - direction: input
    field: description / MediaDescription(media)
    disposition: object_attribute
    facts: []
    ignored_reason: New content attribute.
  - direction: output
    field: friendly_token / MediaToken(media)
    disposition: gen
    facts:
    - Know(actor:User[SELF],MediaToken(media:Media{created}))
    ignored_reason: ''
  l1_bindings:
  - l1_key: http://localhost/api/v1/media
    methods:
    - POST
    selector:
      field: ''
      values: []
  confidence: 0.95
  reasoning: MediaList.post creates Media owned by the user.
  l1_keys:
  - http://localhost/api/v1/media
  consumes:
  - Authenticated(actor:User[SELF],Session)
  - Can(actor:User[SELF],Create,media:Media{target})
  produces:
  - Exists(media:Media{created})
  - Know(actor:User[SELF],MediaToken(media:Media{created}))
  object_type: entity
  lifecycle: ''
  operations: []
  secondary_objects: []
  gt:
    visibility:
      minimum: black_box
      reason: Upload form posts a media file.
    black_box_reachable: true
    reachability_conditions:
    - Authenticated with upload permission (CAN_ADD_MEDIA=all).
    observable_evidence: []
    evidence:
    - type: runtime
      ref: upload token=Yt7r1RFGP -> 201
      supports: Create confirmed
    notes: null
