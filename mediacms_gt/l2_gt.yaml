- id: gt-action-004
  name: Edit media
  kind: normal
  description: The media owner (or contributor/editor) edits a media's title and description.
  action_key: owner_update_media
  subject:
    id: actor
    identity: CurrentUser
    role: User
    auth_context: Session
  operation:
    business: update_media
    crud: Update
  object:
    kind: entity
    id: media
    type: Media
    name: Media
    entity: Media
