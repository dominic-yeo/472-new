  reasoning: MediaDetail.get; 400 on missing confirms Exists precondition.
  l1_keys:
  - http://localhost/api/v1/media/{friendly_token}
  consumes:
  - Know(actor:User[SELF],MediaToken(media:Media{target}))
  - Exists(media:Media{target})
  produces:
  - Know(actor:User[SELF],MediaToken(media:Media{target}))
  object_type: entity
  lifecycle: ''
