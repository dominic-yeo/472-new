schema_version: pengent-web-gt-v1

environment:
  id: "mediacms-9.2.1"
  application: "MediaCMS"
  version_or_commit: "9.2.1 (VERSION=9.2.1; source checkout v9.2.1-1-g874e687)"
  deployment_profile: >-
    docker-compose.yaml stack (web + celery_worker + celery_beat + migrations + postgres:17.2 + redis),
    image mediacms/mediacms:latest @ sha256:bd7ff29a3538ceaa78dc380ebcc6c52a6e54bc4b40678b6e07aea18081ceb553
    (built 2026-10-07). Single web replica on host port 80. Effective settings confirmed in-container:
    USE_RBAC=False, USE_SAML=False, USE_IDENTITY_PROVIDERS=False, USE_LTI=False,
    USERS_NEEDS_TO_BE_APPROVED=False, USERS_CAN_SELF_REGISTER=True, PORTAL_WORKFLOW=public,
    GLOBAL_LOGIN_REQUIRED=False, DEBUG=False, CAN_ADD_MEDIA=all, ALLOW_ANONYMOUS_USER_LISTING=True,
    ALLOW_ANONYMOUS_ACTIONS=[report,like,dislike,watch], GENERATE_SITEMAP=False.
  base_urls:
    - "http://localhost"

scope:
  included:
    - "files app (media, comments, categories, tags, playlists, encode profiles, tasks, media-auth, management views)"
    - "users app (users, user detail/contact, whoami, token, login, profile/channel pages)"
    - "migrationservice app (api/v1/migrations ViewSet + @action routes; superuser)"
    - "uploader app (fu/upload/ chunked upload)"
    - "lti public read endpoints that are served regardless of USE_LTI (jwks, public-key)"
    - "allauth account auth pages (login, logout, signup, password, email) as page nodes"
    - "server-rendered SPA/content pages (index, view, search, members, profiles, manage/*, etc.)"
  excluded:
    - "Django auto-admin generic CRUD (~180 routes over registered models) - framework-generated, no JSON IO contract (excluded_items in l1_gt.yaml)"
    - "debug_toolbar routes - inert with DEBUG=False"
    - "allauth socialaccount/SAML provider routes - no social app configured, USE_SAML=False"
    - "api-auth/ DRF browsable-API login/logout - not an application endpoint"
    - "tinymce editor utility endpoints"
    - "i18n language-cookie setters"
    - "LTI launch/OIDC/select-media/my-media/embed - USE_LTI=False and no LTIPlatform; needs an external LMS (see annotation_issues issue-004)"

black_box_profile:
  provided_information:
    - "base URL http://localhost"
    - "self-registration is open; API docs route (/swagger.json, /docs/api/) is public but errors (issue-001)"
  provided_accounts:
    - identity: "anonymous"
      role: "Guest"
      credential_ref: "none"
    - identity: "user"
      role: "User"
      credential_ref: "test account 'alice' (regular user); DRF token stored out-of-band, not in GT"
    - identity: "admin"
      role: "Admin"
      credential_ref: "superuser 'admin' (created by the migrations service); password/token set out-of-band, not in GT"
  api_docs_provided: true
  source_code_provided: true
  other:
    - "MediaCMS role flags: advancedUser, is_editor, is_manager (editor = superuser|manager|editor; manager = superuser|manager)."
    - "No editor/manager-only (non-superuser) account was provisioned; editor/manager-scoped behavior is confirmed via admin (superuser passes all editor/manager checks) and read from source."

reset:
  procedure_ref: "docker compose down -v && docker compose up -d (migrations service recreates schema + admin user). Fixtures in this GT were created via the live API/ORM (see mediacms_gt/runtime_probe.txt)."
  initial_state: "Fresh DB with a single superuser 'admin'; no media/categories/playlists until seeded."

annotation:
  source_revision: "v9.2.1-1-g874e687 (commit 874e687d29bfcacb7c4d67f409d6ea0e73ca0365)"
  annotator: "dominic-yeo"
  date: "2026-10-19"
  notes: >-
    Source-first enumeration from the Django URLconf + DRF view handlers, reconciled against the live
    URL resolver dump (mediacms_gt/url_dump.txt - authoritative for the running build because
    /swagger.json crashes) and verified with identity-scoped runtime probes (mediacms_gt/runtime_probe.txt).
    YAML is generated by the scripts in mediacms_gt/generators/ (see its README). Deployment authorized for
    testing including state-changing requests.
