schema_version: pengent-web-gt-v1
environment_id: uptrace-oss
nodes:
- id: gt-action-001
  name: Log in
  kind: normal
  description: A visitor logs in and receives a JWT session cookie.
  action_key: anon_login
  subject:
    id: actor
    identity: Anonymous
    role: Guest
    auth_context: Anonymous
  operation:
    business: login_user
    crud: Create
  object:
    kind: state
    id: session
    type: Session
    name: Session
    entity: Session
    role: created
    attribute: ''
    state_field: authenticated
    binding:
      source: response
      field: ''
      resource: AuthToken(session)
    participants:
    - id: user
      type: User
      role: self
      binding: {}
    constraints: []
  requirements:
  - type: knowledge
    fact:
      predicate: Know
      arguments:
      - &id001
        kind: subject
        id: actor
        type: User
        relative_role: SELF
      - kind: reference
        type: Password
        target:
          kind: entity
          id: user
          type: User
          role: self
    reason: Caller supplies email+password.
  effects:
    gen:
    - fact:
        predicate: Authenticated
        arguments:
        - *id001
        - Session
      basis: auth_transition
      reason: Caller becomes authenticated.
    - fact:
        predicate: Know
        arguments:
        - *id001
        - kind: reference
          type: AuthToken
          target:
            kind: entity
            id: session
            type: Session
            role: created
      basis: io_reference
      reason: Sets the 'token' JWT cookie.
    kill: []
  io_accounting:
  - direction: input
    field: email / UserEmail(user)
    disposition: object_attribute
    facts: []
    ignored_reason: Login identifier.
  - direction: input
    field: password / Password(user)
    disposition: req
    facts:
    - Know(actor:User[SELF],Password(user:User{self}))
    ignored_reason: ''
  - direction: output
    field: token / AuthToken(session)
    disposition: gen
    facts:
    - Know(actor:User[SELF],AuthToken(session:Session{created}))
    ignored_reason: ''
  l1_bindings:
  - l1_key: http://localhost:14318/internal/v1/users/login
    methods:
    - POST
    selector:
      field: ''
      values: []
  confidence: 0.9
  reasoning: Login verifies bcrypt and sets the token cookie.
  l1_keys:
  - http://localhost:14318/internal/v1/users/login
  consumes:
  - Know(actor:User[SELF],Password(user:User{self}))
  produces:
  - Authenticated(actor:User[SELF],Session)
  - Know(actor:User[SELF],AuthToken(session:Session{created}))
  object_type: state
  lifecycle: ''
  operations: []
  secondary_objects: []
  gt:
    visibility:
      minimum: black_box
      reason: Public login.
    black_box_reachable: true
    reachability_conditions:
    - User exists in config/db; password matches (bcrypt).
    observable_evidence: []
    evidence:
    - type: source
      ref: uptrace/pkg/org/user_handler.go:Login
      supports: verify + set cookie
    - type: runtime
      ref: '2026-11-19: underlying L1 interface(s) observed at runtime (/internal/v1/users/login)'
      supports: 'runtime: bound interface observed per identity; action effect inferred from interface (interface-observed,
        not effect-observed)'
    notes: null
    grounding:
      tier: interface
      bindings: 1
