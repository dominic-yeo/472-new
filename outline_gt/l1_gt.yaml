excluded_items:
- item: 'SSO auth-provider start/callback routes are modeled generically as /auth/:provider[.callback] (the concrete providers:
    google, azure, oidc, discord, slack, github, gitlab, gitea, linear, notion, figma, email magic-link)'
  reason: Each plugin registers the identical passport start+callback pair under /auth; the two generic nodes capture the
    shared flow + its open-redirect / account-linking surface. Email is modeled explicitly (/auth/email) as it is the password-less
    default.
- item: Realtime collaboration + websockets service (y-websocket /collaboration, socket.io /realtime) and the background worker/cron
    queues
  reason: A separate transport carrying the same documents + policies; out of scope for the HTTP request GT. cron.* is modeled
    as one enumerated node (internal, token-gated).
- item: 'Static/asset + SPA surfaces: the Vite app bundle, /images|/fonts|/email static, document/attachment redirect routes
    that 302 to pre-signed S3/local storage URLs'
  reason: Client assets / storage bytes; the /api that mints the pre-signed URLs (attachments.create, documents.export) is
    the modeled surface.
- item: 'Plugin/integration webhook receivers and provider callbacks (plugins/*: slack, github, gitlab, linear, notion events;
    zapier; webhooks delivery)'
  reason: Edition-/config-gated inbound integrations that reuse the same team + policy model; integrations.* and the webhook
    subscription CRUD are modeled, the per-provider receivers enumerated.
- item: MCP server (/mcp) and OAuth dynamic client registration internals beyond the modeled endpoints
  reason: Feature-flagged AI transport reusing the OAuth access-token + policy model already captured.
