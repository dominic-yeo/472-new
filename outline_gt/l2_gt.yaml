- id: gt-action-001
  name: Read public auth config
  kind: normal
  description: Read public auth config.
  action_key: auth_config
  subject:
    id: actor
    identity: Visitor
    role: Public
    auth_context: None
  operation:
    business: auth_config
    crud: Read
  object:
    kind: entity
    id: authconfig
    type: AuthConfig
    name: AuthConfig
    entity: AuthConfig
    role: response
    attribute: ''
    state_field: ''
    binding:
      source: response
      field: ''
      resource: AuthConfig(team)
    participants: []
    constraints: []
  requirements: []
  effects:
    gen:
    - fact:
        predicate: Know
        arguments:
        - &id001
          kind: subject
          id: actor
          type: User
          relative_role: SELF
        - kind: reference
          type: AuthConfig(team)
          target:
            kind: entity
            id: authconfig
            type: AuthConfig
            role: response
      basis: io_reference
      reason: Returns authconfig.
    kill: []
  io_accounting:
  - direction: output
    field: authconfig / AuthConfig(team)
    disposition: gen
    facts:
    - Know(actor:User[SELF],AuthConfig(team)(authconfig:AuthConfig{response}))
    ignored_reason: ''
  l1_bindings:
  - l1_key: http://localhost:3000/api/auth.config
    methods:
    - POST
    selector:
      field: method
      values:
      - POST
  confidence: 0.8
  reasoning: Read public auth config.
  l1_keys:
  - http://localhost:3000/api/auth.config
  consumes: []
  produces:
  - Know(actor:User[SELF],AuthConfig(team)(authconfig:AuthConfig{response}))
  object_type: entity
  lifecycle: ''
  operations: []
  secondary_objects: []
  gt:
    visibility:
      minimum: black_box
      reason: Read public auth config.
    black_box_reachable: true
    reachability_conditions:
    - PUBLIC. Team existence + enabled SSO providers (enumeration oracle).
    observable_evidence: []
    evidence:
    - type: source
      ref: outline/server/routes/api/auth/auth.ts
      supports: route + policy
