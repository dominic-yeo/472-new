- id: gt-action-004
  name: Bootstrap installation
  kind: normal
  description: On a fresh self-hosted install, a visitor creates the first workspace + admin.
  action_key: installation_create
  subject:
    id: actor
    identity: Visitor
    role: Public
    auth_context: None
  operation:
    business: installation_create
    crud: Create
  object:
    kind: entity
    id: team
    type: Team
    name: Team
    entity: Team
    role: created
    attribute: ''
    state_field: ''
    binding:
      source: response
      field: ''
      resource: TeamID(team)
    participants:
    - id: user
      type: User
      role: self
      binding: {}
    - id: session
      type: Session
      role: created
      binding: {}
    constraints: []
  requirements:
  - type: knowledge
    fact:
      predicate: Know
      arguments:
      - *id001
      - kind: reference
        type: UserEmail
        target:
          kind: entity
          id: user
          type: User
          role: self
    reason: Caller supplies an admin email/name.
  effects:
    gen:
    - fact:
        predicate: Exists
        arguments:
        - kind: entity
          id: team
          type: Team
          role: created
      basis: action_semantics
      reason: The first team is created.
    - fact:
        predicate: Authenticated
        arguments:
        - *id001
        - SessionToken
      basis: auth_transition
      reason: Caller becomes the first admin.
    - fact:
        predicate: Know
        arguments:
        - *id001
        - kind: reference
          type: AccessToken
          target:
            kind: entity
            id: session
            type: Session
            role: created
      basis: io_reference
      reason: Returns an access token.
    kill: []
  io_accounting:
  - direction: input
    field: userEmail / UserEmail(user)
    disposition: req
    facts:
    - Know(actor:User[SELF],UserEmail(user:User{self}))
    ignored_reason: ''
  - direction: output
    field: accessToken / AccessToken(session)
    disposition: gen
    facts:
    - Know(actor:User[SELF],AccessToken(session:Session{created}))
    ignored_reason: ''
  l1_bindings:
  - l1_key: http://localhost:3000/api/installation.create
    methods:
    - POST
    selector:
      field: method
      values:
      - POST
  confidence: 0.85
  reasoning: Creates the first team+admin when none exist.
  l1_keys:
  - http://localhost:3000/api/installation.create
  consumes:
  - Know(actor:User[SELF],UserEmail(user:User{self}))
  produces:
  - Exists(team:Team{created})
  - Authenticated(actor:User[SELF],SessionToken)
  - Know(actor:User[SELF],AccessToken(session:Session{created}))
  object_type: entity
  lifecycle: ''
  operations: []
  secondary_objects: []
  gt:
    visibility:
      minimum: black_box
      reason: First-run bootstrap.
    black_box_reachable: true
    reachability_conditions:
    - 'PUBLIC but single-shot: refuses once any team exists. First-boot takeover.'
    observable_evidence: []
    evidence:
    - type: source
      ref: outline/server/routes/api/installation/installation.ts
      supports: bootstrap
    - type: runtime
      ref: '2026-11-19: underlying L1 interface(s) observed at runtime (/api/installation.create)'
      supports: 'runtime: bound interface observed per identity; action effect inferred from interface (interface-observed,
        not effect-observed)'
