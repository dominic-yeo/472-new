excluded_items:
- item: Per-collection Content API is served by ONE generic controller (/items/:collection[/:pk]); modeled once, not per user-defined
    collection
  reason: Directus has no per-collection route files -- /items/:collection dispatches every collection through the same handler
    + policy engine. A real project's collections multiply the item nodes but share the identical auth model.
- item: System-collection convenience controllers already modeled (users, roles, policies, permissions, access, files, folders,
    flows, operations, presets, dashboards, panels, versions, comments, notifications, translations, revisions, activity,
    settings)
  reason: These wrap the directus_* system collections with the same policy engine; the security-critical ones are L2-covered,
    the rest enumerated as L1 nodes.
- item: AI routes (/ai, /ai/files), MCP server (/mcp, /mcp-oauth/clients), deployment (/deployments, /deployments/webhooks),
    license (/license), TUS resumable upload (/files/tus)
  reason: Feature-flagged / edition-specific surfaces (ENABLE_* envs). They share the token+policy auth model already captured;
    enumerated rather than modeled per-route.
- item: Data Studio SPA bundle (/admin/*) and raw asset bytes served under /assets/:pk
  reason: Client assets / stored file bytes; the REST+GraphQL API that manages them is the modeled surface.
- item: Realtime (WebSocket/SSE) subscriptions and the GraphQL subscription transport
  reason: A separate realtime channel carrying the same collections+permissions; out of scope for the REST/GraphQL request
    GT.
