schema_version: pengent-web-gt-v1
environment_id: directus-oss
nodes:
- id: gt-action-001
  name: Log in
  kind: normal
  description: A visitor authenticates and receives access+refresh tokens.
  action_key: user_login
  subject:
    id: actor
    identity: Visitor
    role: Public
    auth_context: None
  operation:
    business: user_login
    crud: Create
  object:
    kind: state
    id: session
    type: Session
    name: Session
    entity: Session
    role: created
    attribute: ''
    state_field: authenticated
    binding:
      source: response
      field: ''
      resource: AccessToken(session)
    participants:
    - id: user
      type: User
      role: self
      binding: {}
    constraints: []
  requirements:
  - type: knowledge
    fact: &id006
      predicate: Know
      arguments:
      - &id001
        kind: subject
        id: actor
        type: User
        relative_role: SELF
      - kind: reference
        type: Password
        target:
          kind: entity
          id: user
          type: User
          role: self
    reason: Caller supplies email + password.
  effects:
    gen:
    - fact:
        predicate: Authenticated
        arguments:
        - *id001
        - AccessToken
      basis: auth_transition
      reason: Caller becomes authenticated.
    - fact: &id003
        predicate: Know
        arguments:
        - *id001
        - kind: reference
          type: AccessToken
          target:
            kind: entity
            id: session
            type: Session
            role: created
      basis: io_reference
      reason: Returns access + refresh tokens.
    kill: []
  io_accounting:
  - direction: input
    field: email / UserEmail(user)
    disposition: object_attribute
    facts: []
    ignored_reason: Login email.
  - direction: input
    field: password / Password(user)
    disposition: req
    facts:
    - Know(actor:User[SELF],Password(user:User{self}))
    ignored_reason: ''
  - direction: output
    field: access_token / AccessToken(session)
    disposition: gen
    facts:
    - Know(actor:User[SELF],AccessToken(session:Session{created}))
    ignored_reason: ''
  l1_bindings:
  - l1_key: http://localhost:8055/auth/login
    methods: &id002
    - POST
    selector:
      field: method
      values: *id002
  confidence: 0.9
  reasoning: login returns access+refresh tokens.
  l1_keys:
  - http://localhost:8055/auth/login
  consumes:
  - Know(actor:User[SELF],Password(user:User{self}))
  produces:
  - Authenticated(actor:User[SELF],AccessToken)
  - Know(actor:User[SELF],AccessToken(session:Session{created}))
  object_type: state
  lifecycle: ''
  operations: []
  secondary_objects: []
  gt:
    visibility:
      minimum: black_box
      reason: Public login.
    black_box_reachable: true
    reachability_conditions:
    - Public. Brute-force / credential-stuffing; 'otp' for 2FA.
    observable_evidence: []
    evidence:
    - type: source
      ref: directus/api/src/controllers/auth.ts
      supports: login
    - type: runtime
      ref: '2026-11-19: underlying L1 interface(s) observed at runtime (/auth/login)'
      supports: 'runtime: bound interface observed per identity; action effect inferred from interface (interface-observed,
        not effect-observed)'
    notes: null
