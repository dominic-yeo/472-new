schema_version: pengent-web-gt-v1
environment_id: writefreely-multi-user
nodes:
- id: gt-action-001
  name: Sign up
  kind: normal
  description: A visitor registers and receives an API token.
  action_key: anon_signup
  subject:
    id: actor
    identity: Anonymous
    role: Guest
    auth_context: Anonymous
  operation:
    business: signup_user
    crud: Create
  object:
    kind: entity
    id: user
    type: User
    name: User
    entity: User
    role: created
    attribute: ''
    state_field: ''
    binding:
      source: response
      field: username
      resource: Username(user)
    participants:
    - id: session
      type: Session
      role: created
      binding: {}
    constraints: []
  requirements:
  - type: knowledge
    fact:
      predicate: Know
      arguments:
      - &id001
        kind: subject
        id: actor
        type: User
        relative_role: SELF
      - kind: reference
        type: Password
        target:
          kind: entity
          id: user
          type: User
          role: self
    reason: Caller supplies the new account password (brought credential).
  effects:
    gen:
    - fact:
        predicate: Exists
        arguments:
        - kind: entity
          id: user
          type: User
          role: created
      basis: action_semantics
      reason: A new user row is created.
    - fact:
        predicate: Know
        arguments:
        - *id001
        - kind: reference
          type: AuthToken
          target:
            kind: entity
            id: session
            type: Session
            role: created
      basis: io_reference
      reason: Response returns an API access token.
    kill: []
  io_accounting:
  - direction: input
    field: alias / Username(user)
    disposition: object_attribute
    facts: []
    ignored_reason: Chosen username (new content).
  - direction: input
    field: pass / Password(user)
    disposition: req
    facts:
    - Know(actor:User[SELF],Password(user:User{self}))
    ignored_reason: ''
  - direction: input
    field: email / UserEmail(user)
    disposition: object_attribute
    facts: []
    ignored_reason: Optional new email.
  - direction: output
    field: access_token / AuthToken(session)
    disposition: gen
    facts:
    - Know(actor:User[SELF],AuthToken(session:Session{created}))
    ignored_reason: ''
  - direction: output
    field: username / Username(user)
    disposition: observed_only
    facts: []
    ignored_reason: Echo of the created name.
  l1_bindings:
  - l1_key: http://localhost/api/auth/signup
    methods:
    - POST
    selector:
      field: ''
      values: []
  confidence: 0.85
  reasoning: apiSignup creates a User and returns an access token.
  l1_keys:
  - http://localhost/api/auth/signup
  consumes:
  - Know(actor:User[SELF],Password(user:User{self}))
  produces:
  - Exists(user:User{created})
  - Know(actor:User[SELF],AuthToken(session:Session{created}))
  object_type: entity
  lifecycle: ''
  operations: []
  secondary_objects: []
  gt:
    visibility:
      minimum: black_box
      reason: Public signup.
    black_box_reachable: true
    reachability_conditions:
    - Open registration enabled.
    observable_evidence: []
    evidence:
    - type: source
      ref: writefreely/account.go:89 apiSignup
      supports: create user + token
    - type: runtime
      ref: '2026-11-20: effect observed via POST /api/auth/signup -> 201 (pa219112)'
      supports: 'runtime: bound interface returned 201 to POST /api/auth/signup (identity=pa219112) -> resource created; server
        returned it; effect realized and observed (effect-observed)'
    notes: null
