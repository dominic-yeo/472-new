schema_version: pengent-web-gt-v1
environment_id: vocechat-0.5.36-local
nodes:
- id: gt-anonymous_login_password_session
  name: Log in with e-mail and password
  kind: normal
  description: Log in with e-mail and password.
  action_key: anonymous_login_password_session
  subject:
    id: actor
    identity: Anonymous
    role: Guest
    auth_context: Anonymous
  operation:
    business: login
    crud: Create
  object:
    kind: entity
    id: session
    type: Session
    name: User session
    entity: Session
    role: created
    attribute: ''
    state_field: ''
    binding:
      source: response
      field: token
      resource: AccessToken(session)
    participants: []
    constraints: []
  requirements: []
  effects:
    gen:
    - fact:
        predicate: Exists
        arguments:
        - kind: entity
          id: session
          type: Session
          role: created
      basis: action_semantics
      reason: A new access/refresh token pair (session) is created on success.
    - fact:
        predicate: Authenticated
        arguments:
        - kind: subject
          id: actor
          type: User
          relative_role: SELF
        - Session
      basis: auth_transition
      reason: The caller becomes authenticated for the issued session.
    - fact:
        predicate: Know
        arguments:
        - kind: subject
          id: actor
          type: User
          relative_role: SELF
        - kind: reference
          type: AccessToken
          target:
            kind: entity
            id: session
            type: Session
            role: created
      basis: io_reference
      reason: Response returns the access token.
    - fact:
        predicate: Know
        arguments:
        - kind: subject
          id: actor
          type: User
          relative_role: SELF
        - kind: reference
          type: RefreshToken
          target:
            kind: entity
            id: session
            type: Session
            role: created
      basis: io_reference
      reason: Response returns the refresh token (consumed by POST /api/token/renew).
    kill: []
  io_accounting:
  - direction: input
    field: device / DeviceID(device)
    disposition: object_attribute
    facts: []
    ignored_reason: New business content/payload for this action; not a pre-existing object reference.
  - direction: input
    field: device_token / DeviceToken(device)
    disposition: object_attribute
    facts: []
    ignored_reason: New business content/payload for this action; not a pre-existing object reference.
  - direction: input
    field: email / UserEmail(user)
    disposition: object_attribute
    facts: []
    ignored_reason: Credential/secret presented for this action; proof material, not a stable object reference.
  - direction: input
    field: password / UserPassword(user)
    disposition: object_attribute
    facts: []
    ignored_reason: Credential/secret presented for this action; proof material, not a stable object reference.
  - direction: input
    field: magic_token / MagicToken(magic_link)
    disposition: object_attribute
    facts: []
    ignored_reason: Flow input not tied to a precondition fact; carried as part of the action payload.
  - direction: input
    field: id_token / ExternalIdToken(external_account)
    disposition: object_attribute
    facts: []
    ignored_reason: Flow input not tied to a precondition fact; carried as part of the action payload.
  - direction: input
    field: code / OAuthCode(external_account)
    disposition: object_attribute
    facts: []
    ignored_reason: Flow input not tied to a precondition fact; carried as part of the action payload.
  - direction: input
    field: state / OAuthState(external_account)
    disposition: object_attribute
    facts: []
    ignored_reason: Flow input not tied to a precondition fact; carried as part of the action payload.
  - direction: input
    field: public_address / WalletAddress(external_account)
    disposition: object_attribute
    facts: []
    ignored_reason: Flow input not tied to a precondition fact; carried as part of the action payload.
  - direction: input
    field: nonce / WalletNonce(external_account)
    disposition: object_attribute
    facts: []
    ignored_reason: Flow input not tied to a precondition fact; carried as part of the action payload.
  - direction: input
    field: signature / WalletSignature(external_account)
    disposition: object_attribute
    facts: []
    ignored_reason: Flow input not tied to a precondition fact; carried as part of the action payload.
  - direction: input
    field: key / ThirdPartyLoginKey(session)
    disposition: object_attribute
    facts: []
    ignored_reason: Flow input not tied to a precondition fact; carried as part of the action payload.
  - direction: output
    field: token / AccessToken(session)
    disposition: gen
    facts:
    - Know(actor:User[SELF],AccessToken(session:Session{created}))
    ignored_reason: ''
  - direction: output
    field: refresh_token / RefreshToken(session)
    disposition: gen
    facts:
    - Know(actor:User[SELF],RefreshToken(session:Session{created}))
    ignored_reason: ''
  - direction: output
    field: server_id / ServerID(server)
    disposition: observed_only
    facts: []
    ignored_reason: Observed in the response but not a generated semantic fact of this action.
  - direction: output
    field: uid / UserID(user)
    disposition: observed_only
    facts: []
    ignored_reason: Observed in the response but not a generated semantic fact of this action.
  - direction: output
    field: email / UserEmail(user)
    disposition: observed_only
    facts: []
    ignored_reason: Observed in the response but not a generated semantic fact of this action.
  - direction: output
    field: name / UserName(user)
    disposition: observed_only
    facts: []
    ignored_reason: Observed in the response but not a generated semantic fact of this action.
  - direction: output
    field: is_admin / UserAdminFlag(user)
    disposition: observed_only
    facts: []
    ignored_reason: Observed in the response but not a generated semantic fact of this action.
  l1_bindings:
  - l1_key: http://localhost:3009/api/token/login
    methods:
    - POST
    selector:
      field: credential.type
      values:
      - password
  confidence: 0.95
  reasoning: login.rs multiplexes the credential union on credential.type; this action is the password branch.
  l1_keys:
  - http://localhost:3009/api/token/login
  consumes: []
  produces:
  - Exists(session:Session{created})
  - Authenticated(actor:User[SELF],Session)
  - Know(actor:User[SELF],AccessToken(session:Session{created}))
  - Know(actor:User[SELF],RefreshToken(session:Session{created}))
  object_type: entity
  lifecycle: ''
  operations: []
  secondary_objects: []
  gt:
    visibility:
      minimum: black_box
      reason: Called by the shipped web client; visible in JS bundle and network traffic.
    black_box_reachable: true
    reachability_conditions:
    - LoginConfig.password=true (enabled by default in the deployment)
    observable_evidence:
    - observer_l1_key: http://localhost:3009/api/token/login
      expected: POST http://localhost:3009/api/token/login reflects the login outcome described above.
    evidence:
    - type: source
      ref: vocechat-server-rust-0.5.36/src/api/token.rs:598
      supports: 'POST handler: route, parameters, auth checks and response type'
    - type: source
      ref: vocechat-web/src/app/services/auth.ts:31
      supports: POST called by deployed web client; request shape
    - type: runtime
      ref: 'vocechat_gt/auth.har entry #89 (2026-10-06T09:05:18.159Z)'
      supports: POST http://localhost:3009/api/token/login as anonymous -> 200
    - type: runtime
      ref: 'vocechat_gt/localhost.har entry #0 (2026-10-06T08:36:14.273Z)'
      supports: POST http://localhost:3009/api/token/login as anonymous -> 200
    notes: 'Single endpoint multiplexes 7 credential types via credential.type; only password/magiclink(and thirdparty if
      enabled) are enabled in the deployment (login config: password=true, magic_link=true, google/github/metamask/third_party=false,
      oidc=[]). Status codes from LoginApiResponse (token.rs:264-287) plus 451 license check (license.rs:105).'
