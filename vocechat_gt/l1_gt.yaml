    inputs:
    - issuer
    - redirect_uri
    outputs:
    - auth_url
    input:
      issuer: string
      redirect_uri: string
    request:
      body_format: json
      body_example:
        issuer: accounts.example.com
        redirect_uri: http://localhost:3009/#/oauth/oidc
      fields:
      - name: issuer
        location: body
        path: issuer
        type: string
        required: true
        flow: true
        description: OIDC issuer domain; must match an enabled LoginConfig.oidc entry.
      - name: redirect_uri
        location: body
        path: redirect_uri
        type: string
        required: true
        flow: true
        description: Client redirect URI registered dynamically.
    response:
      format: json
      scalar_type: null
      value_name: null
      value_type: null
      value_flow: false
      value_description: null
      fields:
      - name: auth_url
        path: url
        type: string
        flow: true
        description: Provider authorisation URL with PKCE challenge.
    reason: 'Request/response contract read from the poem-openapi handler signature and payload structs. Feature-gated: deployment
      login config has oidc: [] so the handler returns 403 (token.rs:418-424).'
    evidence: source vocechat-server-rust-0.5.36/src/api/token.rs:407; frontend vocechat-web/src/app/services/auth.ts:123
  operation_semantic: start_oidc_authorization
  semantic_inputs:
  - ExternalURL(url)
  - OIDCIssuer(server)
  semantic_outputs:
  - ExternalURL(url)
  semantic_input_decisions:
  - raw_field: issuer
    resource: OIDCIssuer(server)
    mergeable: true
    value_kind: attribute
    reference_capable: false
    reference_fields: []
    reason: OIDC issuer domain configured by admin.
  - raw_field: redirect_uri
    resource: ExternalURL(url)
    mergeable: true
    value_kind: locator
    reference_capable: false
    reference_fields: []
    reason: Client redirect URL; not an application object.
  semantic_output_decisions:
  - raw_field: auth_url
    resource: ExternalURL(url)
    mergeable: true
    value_kind: locator
    reference_capable: false
    reference_fields: []
    reason: Provider authorisation URL.
