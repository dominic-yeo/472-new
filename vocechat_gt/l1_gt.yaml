  - raw_field: userid
    resource: ThirdPartyUserID(external_account)
    mergeable: true
    value_kind: identifier
    reference_capable: false
    reference_fields: []
    reason: External user id embedded in third-party key (not an object reference inside VoceChat).
  - raw_field: username
    resource: ThirdPartyUserName(external_account)
    mergeable: true
    value_kind: attribute
    reference_capable: false
    reference_fields: []
    reason: External username.
  semantic_output_decisions:
  - raw_field: third_party_key
    resource: ThirdPartyLoginKey(session)
    mergeable: true
    value_kind: credential
    reference_capable: false
    reference_fields: []
    reason: HMAC-signed short-lived third-party login key.
