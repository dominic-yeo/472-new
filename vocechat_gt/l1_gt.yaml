- key: http://localhost:3009/api/token/login
  kind: api
  methods:
  - POST
  statuses:
  - 200
  - 400
  - 401
  - 403
  - 404
  - 409
  - 410
  - 423
  - 451
  content_types:
  - application/json
  params: []
  inputs:
  - email
  - password
  - magic_token
  - id_token
  - code
  - state
  - public_address
  - nonce
  - signature
  - key
  - device
  - device_token
  outputs:
  - server_id
  - token
  - refresh_token
  - uid
  - email
  - name
  - is_admin
  input_spec:
    format: json
    fields:
    - email
    - password
    - magic_token
    - id_token
    - code
    - state
    - public_address
    - nonce
    - signature
    - key
    - device
    - device_token
  io_variants:
  - method: POST
    content_types:
    - application/json
    inputs:
    - email
    - password
    - magic_token
    - id_token
    - code
    - state
    - public_address
    - nonce
    - signature
    - key
    - device
    - device_token
    outputs:
    - server_id
    - token
    - refresh_token
    - uid
    - email
    - name
    - is_admin
    input:
      email: string
      password: string
      magic_token: string
      id_token: string
      code: string
      state: string
      public_address: string
      nonce: string
      signature: string
      key: string
      device: string
      device_token: string
    request:
      body_format: json
      body_example:
        credential:
          type: password
          email: test@test.com
          password: <redacted>
        device: web:<id>
        device_token: ''
      fields:
      - name: type
        location: body
        path: credential.type
        type: string
        required: true
        flow: false
        description: Credential discriminator password|magiclink|google|github|oidc|metamask|thirdparty (selects which of
          the conditional fields below apply).
      - name: email
        location: body
        path: credential.email
        type: string
        required: false
        flow: true
        description: Account e-mail. Required ONLY when credential.type=password.
      - name: password
        location: body
        path: credential.password
        type: string
        required: false
        flow: true
        description: Account password. Required ONLY when credential.type=password.
      - name: magic_token
        location: body
        path: credential.magic_token
        type: string
        required: false
        flow: true
        description: Login/invite magic token. Required for type=magiclink; optional for oauth types.
      - name: extra_name
        location: body
        path: credential.extra_name
        type: string
        required: false
        flow: false
        description: Name for auto-registration via magic link (type=magiclink).
      - name: id_token
        location: body
        path: credential.id_token
        type: string
        required: false
        flow: true
        description: Google ID token. Required ONLY when credential.type=google.
      - name: code
        location: body
        path: credential.code
        type: string
        required: false
        flow: true
        description: OAuth code. Required ONLY when credential.type=github|oidc.
      - name: state
        location: body
        path: credential.state
        type: string
        required: false
        flow: true
        description: OIDC state. Required ONLY when credential.type=oidc.
      - name: public_address
        location: body
        path: credential.public_address
        type: string
        required: false
        flow: true
        description: Wallet address. Required ONLY when credential.type=metamask.
      - name: nonce
        location: body
        path: credential.nonce
        type: string
        required: false
        flow: true
        description: Nonce from /token/metamask/nonce. Required ONLY when credential.type=metamask.
      - name: signature
        location: body
        path: credential.signature
        type: string
        required: false
        flow: true
        description: Wallet signature. Required ONLY when credential.type=metamask.
      - name: key
        location: body
        path: credential.key
        type: string
        required: false
        flow: true
        description: Third-party key from /token/create_third_party_key. Required ONLY when credential.type=thirdparty.
      - name: device
        location: body
        path: device
        type: string
        required: false
        flow: true
        description: Client device id (default 'unknown').
      - name: device_token
        location: body
        path: device_token
        type: string
        required: false
        flow: true
        description: Optional FCM token.
    response:
      format: json
      scalar_type: null
      value_name: null
      value_type: null
      value_flow: false
      value_description: null
      fields:
      - name: server_id
        path: server_id
        type: string
        flow: true
        description: Server id.
      - name: token
        path: token
        type: string
        flow: true
        description: Access token.
      - name: refresh_token
        path: refresh_token
        type: string
        flow: true
        description: Refresh token.
      - name: expired_in
        path: expired_in
        type: integer
        flow: false
        description: Access token lifetime (s).
      - name: uid
        path: user.uid
        type: integer
        flow: true
        description: User id.
      - name: email
        path: user.email
        type: string
        flow: true
        description: Account e-mail (nullable).
      - name: name
        path: user.name
        type: string
        flow: true
        description: Display name (unique).
      - name: gender
        path: user.gender
        type: integer
        flow: false
        description: Gender code.
      - name: language
        path: user.language
        type: string
        flow: false
        description: UI language tag.
      - name: is_admin
        path: user.is_admin
        type: boolean
        flow: true
        description: Administrator flag.
      - name: is_bot
        path: user.is_bot
        type: boolean
        flow: false
        description: Bot account flag.
      - name: avatar_updated_at
        path: user.avatar_updated_at
        type: integer
        flow: false
        description: Avatar version timestamp (ms).
      - name: create_by
        path: user.create_by
        type: string
        flow: false
        description: Account creation method.
    reason: 'Request/response contract read from the poem-openapi handler signature and payload structs. Single endpoint multiplexes
      7 credential types via credential.type; only password/magiclink(and thirdparty if enabled) are enabled in the deployment
      (login config: password=true, magic_link=true, google/github/metamask/third_party=false, oidc=[]). Status codes from
      LoginApiResponse (token.rs:264-287) plus 451 license check (license.rs:105).'
    evidence: source vocechat-server-rust-0.5.36/src/api/token.rs:598; frontend vocechat-web/src/app/services/auth.ts:31;
      runtime auth.har#89 (anonymous -> 200), localhost.har#0 (anonymous -> 200)
