- key: http://localhost:3009/api/token/create_third_party_key
  kind: api
  methods:
  - POST
  statuses:
  - 200
  - 400
  - 403
  content_types:
  - application/json
  params: []
  inputs:
  - X-SECRET
  - userid
  - username
  outputs:
  - third_party_key
  input_spec:
    format: json
    fields:
    - X-SECRET
    - userid
    - username
  io_variants:
  - method: POST
    content_types:
    - application/json
    inputs:
    - X-SECRET
    - userid
    - username
    outputs:
    - third_party_key
    input:
      userid: string
      username: string
    request:
      body_format: json
      body_example:
        userid: ext-1
        username: ext-user
      fields:
      - name: X-SECRET
        location: header
        path: ''
        type: string
        required: true
        flow: true
        description: Server third-party secret (from GET /admin/system/third_party_secret).
      - name: userid
        location: body
        path: userid
        type: string
        required: true
        flow: true
        description: External user id to embed.
      - name: username
        location: body
        path: username
        type: string
        required: true
        flow: true
        description: External username to embed.
    response:
      format: scalar
      scalar_type: string
      value_name: third_party_key
      value_type: string
      value_flow: true
      value_description: Hex HMAC-signed key valid for 120 s.
      fields: []
    reason: Request/response contract read from the poem-openapi handler signature and payload structs. Missing X-SECRET header
      -> 400 (poem required header); wrong secret -> 403 (token.rs:556).
    evidence: source vocechat-server-rust-0.5.36/src/api/token.rs:548
  operation_semantic: create_third_party_login_key
  semantic_inputs:
  - ThirdPartySecret(server)
  - ThirdPartyUserID(external_account)
  - ThirdPartyUserName(external_account)
  semantic_outputs:
  - ThirdPartyLoginKey(session)
  semantic_input_decisions:
  - raw_field: X-SECRET
    resource: ThirdPartySecret(server)
    mergeable: true
    value_kind: credential
    reference_capable: false
    reference_fields: []
