  resource_types:
  - fetch
  js_sources:
  - http://localhost:3009/static/js/main.2d25c1cb.js
  identity_statuses:
    anonymous:
    - 200
    - 400
    - 403
    - 503
    user:
    - 200
    - 400
    - 403
    - 503
    admin:
    - 200
    - 400
    - 403
    - 503
  route_confirmed: false
  runtime_api_prefixes:
  - http://localhost:3009/api
  gt:
    visibility:
      minimum: black_box
      reason: Called by the shipped web client; visible in JS bundle and network traffic.
    black_box_reachable: true
    reachability_conditions:
    - Admin configures an OIDC/Google/GitHub provider via POST /api/admin/login/config
