  kind: normal
  description: A developer confirms their API key is accepted.
  action_key: dev_verify_api_key
  subject:
    id: actor
    identity: ApiKeyHolder
    role: Developer
    auth_context: ApiKey
  operation:
    business: verify_api_key
    crud: Read
  object:
    kind: entity
    id: auth
    type: ApiKeyAuth
    name: ApiKeyAuth
    entity: ApiKeyAuth
    role: target
    attribute: ''
    state_field: ''
    binding:
      source: implicit
      field: ''
      resource: ''
    participants: []
    constraints: []
  requirements:
  - type: authentication
    fact: &id002
      predicate: Authenticated
      arguments:
      - &id001
        kind: subject
        id: actor
        type: User
        relative_role: SELF
      - ApiKey
    reason: validApiKey verifies the Authorization Bearer key.
  effects:
    gen:
    - fact:
        predicate: Know
        arguments:
        - *id001
        - kind: reference
          type: AuthStatus
          target:
            kind: entity
            id: auth
            type: ApiKeyAuth
            role: target
      basis: implicit_context
      reason: Response confirms the API key is valid (authenticated:true).
    kill: []
  io_accounting: []
  l1_bindings:
  - l1_key: http://localhost/api/v1/auth
    methods:
    - GET
    selector:
      field: ''
      values: []
  confidence: 0.98
  reasoning: Fixed status endpoint behind validApiKey.
  l1_keys:
  - http://localhost/api/v1/auth
  consumes:
  - Authenticated(actor:User[SELF],ApiKey)
  produces:
  - Know(actor:User[SELF],AuthStatus(auth:ApiKeyAuth{target}))
  object_type: entity
  lifecycle: ''
  operations: []
  secondary_objects: []
  gt:
    visibility:
      minimum: black_box
      reason: Probe the API key by calling the endpoint.
    black_box_reachable: true
    reachability_conditions:
    - Valid instance API key
    observable_evidence: []
    evidence:
    - type: source
      ref: server/endpoints/api/auth/index.js:6
      supports: validApiKey gate + fixed response
    - type: runtime
      ref: '2026-11-20: bound L1 interface(s) observed at runtime (/api/v1/auth)'
      supports: 'runtime: bound interface observed per identity; interface-observed, not effect-observed'
    notes: null
