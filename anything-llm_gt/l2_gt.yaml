    observable_evidence: []
    evidence:
    - type: source
      ref: server/endpoints/api/system/index.js:16
      supports: no auth middleware; dumpENV() in production
    - type: runtime
      ref: '2026-11-20: underlying L1 interface(s) observed at runtime (/api/v1/system/env-dump)'
      supports: 'runtime: bound interface observed per identity; action effect inferred from interface (interface-observed,
