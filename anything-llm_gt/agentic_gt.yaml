schema_version: agentic-attack-surface-v1
environment_id: anythingllm-oss
meta:
  app: anything-llm
  app_version: repo @ 472-new checkout
  git_ref: see source_root
  applicability:
    verdict: qualifies
    evidence: AIbitat agent graph (server/utils/agents/aibitat/index.js) running a provider tool-call
      loop over skills/imported-plugins/flows/MCP; AgentHandler entry via @agent.
  phase_status:
    static_A_to_D: complete
    runtime_E: partial (40/58 records observed live via @agent on local Ollama, 2026-11-20)
    link_F: partial (L1/L2 GT for anything-llm not yet built; ids are forward refs)
agents:
- id: agent.anythingllm.workspace
  name: Workspace agent (@agent)
  component: anything-llm
  agent_kind: interactive
  purpose: Primary agent for a workspace; runs the AIbitat tool-call loop over enabled skills, imported
    plugins, agent flows, and MCP servers.
  invocation_surfaces:
  - l1_id: l1.ws.agent_invocation
    trigger: '`@agent` prefix in a workspace chat (websocket agent session)'
    auth_context: workspace membership; multi-user role (admin|manager|default)
  - l1_id: l1.api.workspace_agent
    trigger: developer API agent invocation / ephemeral agent
    auth_context: API key
  model_config:
    provider: workspace agent provider (OpenAI/Anthropic/Ollama/Gemini/... tooled or untooled)
    model: workspace agent model
    config_source: workspace + system settings (admin)
    writers:
    - principal: admin
      l1_id: l1.api.system_settings
    - principal: workspace_manager
      l1_id: l1.api.workspace.update
    evidence_status: source_confirmed
  instruction_sources:
  - surface_id: ctx.system_prompt
    instruction_role: system
    precedence: base
    config_version: runtime
    writers:
    - principal: workspace_manager
      l1_id: l1.api.workspace.update
  - surface_id: ctx.clarifying_note
    instruction_role: system
    precedence: appended
    config_version: runtime
    writers:
    - principal: admin
      l1_id: l1.api.system_settings
  tool_binding_ids:
  - tool.ws.memory
  - tool.ws.rag_docs
  - tool.ws.web_browsing
  - tool.ws.web_scraping
  - tool.ws.sql_agent
  - tool.ws.filesystem
  - tool.ws.create_files
  - tool.ws.gmail
  - tool.ws.outlook
  - tool.ws.gcal
  - tool.ws.generate_image
  - tool.ws.rechart
  - tool.ws.request_user_input
  - tool.ws.scheduled_job
  - tool.ws.imported_plugin
  - tool.ws.agent_flow
  - tool.ws.mcp
  context_source_ids:
  - ctx.system_prompt
  - ctx.clarifying_note
  - ctx.user_message
  - ctx.chat_history
  - ctx.rag_context
  - ctx.tool_results
  - ctx.web_content
  - ctx.memory_recall
  - ctx.tool_descriptions
  - ctx.clarifying_input
  - ctx.flow_variables
  memory_ids:
  - mem.workspace_chats
  - mem.embeddings
  - mem.agent_memory
  - mem.scheduled_jobs
  - mem.filesystem
  output_sink_ids:
  - sink.chat_response
  - sink.email
  - sink.calendar
  - sink.files
  - sink.image
  - sink.sql_write
  - sink.external_call
  - sink.scheduled_job
  control_ids:
  - ctl.user_oversight
  - ctl.imported_tool_approval
  - ctl.max_tool_calls
  - ctl.skill_enablement
  - ctl.multiuser_skill_gate
  - ctl.model_router_cooldown
  - ctl.abort
  resource_limits:
    max_iterations: AGENT_MAX_TOOL_CALLS (default cap) + maxRounds per response
    recursion: flows/sub-stages are bounded; no open agent self-spawn
    token_or_cost_budget: none in core
    loop_detection: maxRounds boundary + abort
    enforced_by: code
  authority_context:
    principal_source: workspace user (session) or API key
    tenant_scope: workspace-scoped RAG/chats
    resource_scope: workspace documents + INSTANCE-level connected accounts
    delegated_identity: external skills use INSTANCE stored credentials, NOT the user's
    authz_enforcement: code (role + workspace membership); connected-account scope NOT per-user
  related_l2_ids:
  - l2.workspace.agent_chat
  visibility: white_box_required
  reachability:
    status: black_box_reachable
    notes: ''
  source_ref: utils/agents/index.js AgentHandler; utils/agents/defaults.js WORKSPACE_AGENT; aibitat/index.js
  evidence_status: source_confirmed
  notes: Skill set = DEFAULT_SKILLS (memory, docSummarizer, webScraping, webBrowsing) + admin-enabled
    skills + imported plugins + flows + MCP. ToolReranker may trim the exposed set.
- id: agent.anythingllm.ephemeral
  name: Ephemeral agent
  component: anything-llm
  agent_kind: specialist
  purpose: Headless agent session used by the developer API, agent flows, and scheduled jobs; same loop
    without a live websocket user.
  invocation_surfaces:
  - l1_id: l1.api.ephemeral_agent
    trigger: API / flow / scheduled-job runner
    auth_context: API key or system (scheduled)
  model_config:
    provider: inherits workspace
    model: workspace model
    config_source: workspace/system
    writers: []
    evidence_status: source_confirmed
  instruction_sources:
  - surface_id: ctx.system_prompt
    instruction_role: system
    precedence: base
    config_version: runtime
    writers:
    - principal: workspace_manager
      l1_id: l1.api.workspace.update
  tool_binding_ids:
  - tool.ws.rag_docs
  - tool.ws.web_browsing
  - tool.ws.web_scraping
  - tool.ws.sql_agent
  - tool.ws.imported_plugin
  - tool.ws.mcp
  context_source_ids:
  - ctx.system_prompt
  - ctx.rag_context
  - ctx.tool_results
  - ctx.web_content
  - ctx.flow_variables
  memory_ids:
  - mem.workspace_chats
  - mem.embeddings
  output_sink_ids:
  - sink.external_call
  - sink.files
  - sink.email
  control_ids:
  - ctl.max_tool_calls
  - ctl.skill_enablement
  resource_limits:
    max_iterations: AGENT_MAX_TOOL_CALLS
    recursion: bounded
    token_or_cost_budget: none
    loop_detection: maxRounds
    enforced_by: code
  authority_context:
    principal_source: API key / scheduler
    tenant_scope: workspace
    resource_scope: workspace + instance accounts
    delegated_identity: instance credentials; no live human oversight (USER interrupt absent)
    authz_enforcement: code
  related_l2_ids:
  - l2.workspace.agent_chat
  visibility: white_box_required
  reachability:
    status: black_box_reachable
    notes: ''
  source_ref: utils/agents/ephemeral.js; utils/agentFlows; create-scheduled-job
  evidence_status: observed
  notes: 'No USER human-monitor in the loop -> ctl.user_oversight does not apply; higher autonomy | RUNTIME
    2026-11-20: observed exercised in live AnythingLLM @agent runs on local Ollama (llama3.1:8b) -- EphemeralAgentHandler
    + AIbitat tooled loop. Tools invoked: web-browsing, web-scraping, rag-memory, document-summarizer,
    filesystem (list/move), create-text-file, create-chart, create-scheduled-job, request-user-input,
    sql-query, gt-echo (imported skill), gt-flow (agent flow). Approval control observed: ''Tool approval
    requested for create-scheduled-job ... Auto-denying for safety''. IntelligentSkillSelector gated skills.'
