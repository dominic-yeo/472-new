  tool_name: terminal / bash exec
  tool_source: native
  server_or_provider: null
  schema_ref: null
  description_source: null
  capabilities:
  - run shell commands; background/durable exec
  execution_identity: &id001
    identity: agent workspace/sandbox process
    credential_source: agent config / sandbox lease; resolveGatewayExecAuthority (execution-authority.ts)
  argument_handling: &id002
    validation: tool args validated against the tool JSON schema before execution (agent-loop validation.ts)
    authorization: before_tool_call hook/policy chain (agent-tools.before-tool-call.policy.ts)
    normalization: runtime-specific (tool-call-repair)
    enforced_by: code
  output_ids:
  - ctx.tool_results
  - sink.exec
  execution_environment: &id003
    sandbox: 'Docker sandbox (src/agents/sandbox/config.ts: network default ''none'', readOnlyRoot default true; container-allocation.ts
      applies --network + capDrop) or Crabbox lease; UNSANDBOXED host if sandbox disabled'
    network_egress: none by default (network 'none'); host network if unsandboxed
    filesystem_scope: agent/sandbox workspace
    enforced_by: platform_config
  effect_class: code_execution
  approval_required: true
  control_ids:
  - ctl.sandbox
  - ctl.before_tool_hook
  - ctl.exec_approval
  - ctl.requester_tool_policy
  related_l2_ids:
  - l2.agent.channel_run
