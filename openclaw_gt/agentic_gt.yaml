  - mem.sessions
  output_sink_ids:
  - sink.agent_send
  - sink.channel_reply
  control_ids:
  - ctl.owner_trust
  - ctl.before_tool_hook
  resource_limits: null
  authority_context:
    principal_source: owner/operator
    tenant_scope: fleet-wide
    resource_scope: fleet creation + role assignment
    delegated_identity: ring-zero/owner
    authz_enforcement: human approval (owner trust) for creation/role instructions
  related_l2_ids:
  - l2.agent.channel_run
  visibility: white_box_required
  reachability:
    status: black_box_reachable
    notes: ''
  source_ref: src/agents/tools/system-agent-tool.ts; src/agents/execution-authority.ts (resolveGatewayExecAuthority); qa/scenarios/config/system-agent-ring-zero-setup.yaml
  evidence_status: source_confirmed
  notes: Elevated authority node; role instructions require human approval before taking effect.
  runtime_blocker: local_not_driven
tool_bindings:
- id: tool.primary.terminal
  agent_id: agent.openclaw.primary
  l1_ids:
