  reachability:
    status: black_box_reachable
    notes: ''
  evidence_status: observed
  source_ref: src/agents/tools/terminal-tool.ts; src/agents/bash-tools.exec-run.ts; bash-tools.exec-approval-request.ts; bash-process-registry.ts
  notes: 'Arbitrary command execution; isolation depends on sandbox config -> UNSANDBOXED host runs = full RCE. Exec can require
    approval (bash-tools.exec-approval-*) | RUNTIME 2026-11-20: observed via `openclaw agent --local` on local qwen2.5 (num_ctx
