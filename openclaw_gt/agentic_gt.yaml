schema_version: agentic-attack-surface-v1
environment_id: openclaw-oss
meta:
  app: openclaw
  app_version: repo @ 472-new checkout
  git_ref: see source_root
  applicability:
    verdict: qualifies
    evidence: multi-agent gateway running coding-agent loops (built-in or external runtimes) over shell/file/browser/MCP/subagent/A2A
      tools, driven by messaging channels (docs/concepts/agent-loop.md, docs/gateway/*).
  phase_status:
    static_A_to_D: complete (DOC-DERIVED; code symbols pending)
    runtime_E: pending (no live grounding yet)
    link_F: partial (L1/L2 GT for openclaw not yet built; ids are forward refs)
agents:
- id: agent.openclaw.primary
  name: Fleet agent (per channel/role)
  component: openclaw
  agent_kind: interactive
  purpose: An agent entry in the fleet; runs a coding-agent loop (built-in or external runtime) over shell/file/browser/MCP/skill
    tools, reachable via messaging channels.
  invocation_surfaces:
  - l1_id: l1.channel.whatsapp
    trigger: inbound WhatsApp DM/group message (dmPolicy pairing/allowlist)
    auth_context: channel identity gated by DM allowlist; bound agent
  - l1_id: l1.channel.feishu
    trigger: inbound Feishu/Slack/other channel message
    auth_context: channel account; agent binding
  - l1_id: l1.gateway.rpc
    trigger: Gateway RPC / Control UI talk
    auth_context: operator/owner
  - l1_id: l1.a2a.inbound
    trigger: agent-to-agent message from a peer agent
    auth_context: tools.agentToAgent allow policy
  model_config:
    provider: configurable per agentRuntime (claude-cli/codex/copilot/muse/openclaw)
    model: provider/model runtime policy
    config_source: agents.defaults + agents.entries.* (operator)
    writers:
    - principal: operator
      l1_id: l1.config.agents
    - principal: plugin
      l1_id: l1.plugin.before_prompt_build
    evidence_status: source_confirmed
  instruction_sources:
  - surface_id: ctx.system_prompt
    instruction_role: system
    precedence: base
    config_version: runtime
    writers:
    - principal: operator
      l1_id: l1.config.agents
  - surface_id: ctx.skill_instructions
    instruction_role: developer
    precedence: injected
    config_version: runtime
    writers:
    - principal: operator
      l1_id: l1.workspace.skills
    - principal: agent
      l1_id: null
  - surface_id: ctx.plugin_injected
    instruction_role: system
    precedence: injected
    config_version: runtime
    writers:
    - principal: plugin
      l1_id: l1.plugin.before_prompt_build
  tool_binding_ids:
  - tool.exec
  - tool.file
  - tool.browser
  - tool.message
  - tool.subagent_spawn
  - tool.agent_send
  - tool.mcp
  - tool.skills
  - tool.session
  context_source_ids:
  - ctx.system_prompt
  - ctx.skill_instructions
  - ctx.plugin_injected
  - ctx.channel_message
  - ctx.session_history
  - ctx.tool_results
  - ctx.browser_content
  - ctx.tool_descriptions
  - ctx.subagent_task
  - ctx.cross_agent_message
  memory_ids:
  - mem.sessions
  - mem.workspace
  - mem.skills
  - mem.fleet_config
  output_sink_ids:
  - sink.channel_reply
  - sink.exec
  - sink.browser
  - sink.file_write
  - sink.agent_send
  - sink.mcp_call
  control_ids:
  - ctl.sandbox
  - ctl.before_tool_hook
  - ctl.dm_allowlist
  - ctl.agent_to_agent
  - ctl.skill_allowlist
  - ctl.owner_trust
  - ctl.tool_arg_validation
  - ctl.session_visibility
  resource_limits:
    max_iterations: turn-scoped; model attempt timeout aborts a stuck attempt
    recursion: subagent spawn depth + child limits
    token_or_cost_budget: global capacity + per-turn
    loop_detection: session controller serialization + host stop decisions
    enforced_by: code
  authority_context:
    principal_source: messaging-channel sender (gated) or operator
    tenant_scope: per-agent workspace/session; fleet isolation
    resource_scope: agent workspace + sandbox; channel account; allowed peer agents
    delegated_identity: tools run in the agent's workspace/sandbox; messaging under the channel account
    authz_enforcement: code/config (DM allowlist + agentToAgent allow + skill allowlist + sandbox + hooks)
  related_l2_ids:
  - l2.agent.channel_run
  visibility: white_box_required
  reachability:
    status: black_box_reachable
    notes: ''
  source_ref: docs/concepts/agent-loop.md; agent-runtimes.md; docs/gateway/*; src (TS monorepo)
  evidence_status: source_confirmed
  notes: 'Untrusted entry is a channel message: anyone who passes the DM allowlist can drive the agent
    and its tools. The core attack surface.'
- id: agent.openclaw.subagent
  name: Sub-agent (background spawn)
  component: openclaw
  agent_kind: specialist
  purpose: Background run spawned from a parent (agent:<id>:subagent:<uuid>), session-separated, with
    a deliberately restricted tool surface (no session/message tools by default).
  invocation_surfaces:
  - l1_id: l1.internal.subagent_spawn
    trigger: sessions_spawn / subagent tool
    auth_context: parent agent; operator approval for creation hierarchy
  model_config:
    provider: agents.defaults.subagents.model or per-agent override
    model: subagent model
    config_source: subagents config
    writers:
    - principal: operator
      l1_id: l1.config.agents
    evidence_status: source_confirmed
  instruction_sources:
  - surface_id: ctx.subagent_task
    instruction_role: developer
    precedence: base
    config_version: runtime
    writers:
    - principal: agent.openclaw.primary
      l1_id: null
  tool_binding_ids:
  - tool.exec
  - tool.file
  - tool.browser
  - tool.mcp
  context_source_ids:
  - ctx.subagent_task
  - ctx.tool_results
  - ctx.browser_content
  memory_ids:
  - mem.sessions
  - mem.workspace
  output_sink_ids:
  - sink.exec
  - sink.browser
  - sink.file_write
  - sink.subagent_result
  control_ids:
  - ctl.sandbox
  - ctl.before_tool_hook
  - ctl.subagent_policy
  resource_limits:
    max_iterations: turn-scoped
    recursion: own spawn depth/child limits still govern
    token_or_cost_budget: subagent model budget
    loop_detection: lifecycle owner
    enforced_by: code
  authority_context:
    principal_source: parent agent (inherited sender)
    tenant_scope: separate session; optional separate sandbox
    resource_scope: 'restricted: no session/message tools by default'
    delegated_identity: inherited sender + sandbox/channel restrictions
    authz_enforcement: code (tools.subagents.tools; allowAgents; spawn limits)
  related_l2_ids:
  - l2.agent.channel_run
  visibility: white_box_required
  reachability:
    status: black_box_reachable
    notes: ''
  source_ref: docs/concepts/multi-agent.md; docs/tools/subagents.md
  evidence_status: source_confirmed
  notes: Hidden subagents get the restrictive tool denies; visible spawned sessions are interactive and
    get message/session tools.
- id: agent.openclaw.system
  name: System agent (ring-zero)
  component: openclaw
  agent_kind: other
  purpose: Privileged system/owner agent governing fleet creation, onboarding, and owner-trust decisions.
  invocation_surfaces:
  - l1_id: l1.gateway.system
    trigger: system-agent chat / ring-zero setup
    auth_context: owner/operator; ring-zero
  model_config:
    provider: configured
    model: system model
    config_source: operator
    writers:
    - principal: operator
      l1_id: l1.config.agents
    evidence_status: source_confirmed
  instruction_sources:
  - surface_id: ctx.system_prompt
    instruction_role: system
    precedence: base
    config_version: runtime
    writers:
    - principal: operator
      l1_id: l1.config.agents
  tool_binding_ids:
  - tool.subagent_spawn
  - tool.agent_send
  - tool.session
  - tool.message
  context_source_ids:
  - ctx.system_prompt
  - ctx.channel_message
  - ctx.session_history
  memory_ids:
  - mem.fleet_config
  - mem.sessions
  output_sink_ids:
  - sink.agent_send
  - sink.channel_reply
  control_ids:
  - ctl.owner_trust
  - ctl.before_tool_hook
  resource_limits: null
  authority_context:
    principal_source: owner/operator
    tenant_scope: fleet-wide
    resource_scope: fleet creation + role assignment
    delegated_identity: ring-zero/owner
    authz_enforcement: human approval for creation/role instructions + owner trust
  related_l2_ids:
  - l2.agent.channel_run
  visibility: white_box_required
  reachability:
    status: black_box_reachable
    notes: ''
  source_ref: docs/concepts/multi-agent.md (ownership, ring-zero); qa/scenarios/config/system-agent-ring-zero-setup.yaml
  evidence_status: source_confirmed
  notes: Elevated authority node; role instructions require human approval before taking effect.
tool_bindings:
- id: tool.exec
  agent_id: agent.openclaw.primary
  l1_ids: []
  tool_name: shell / exec (native)
  tool_source: native
  server_or_provider: null
  schema_ref: null
  description_source: null
  capabilities:
  - run shell commands; background exec
  execution_identity: &id001
    identity: agent workspace/sandbox process
    credential_source: agent config / sandbox lease
  argument_handling:
    validation: tool args validated against the tool schema before execution
    authorization: before_tool_call hook + policy
    normalization: runtime-specific
    enforced_by: code
  output_ids:
  - ctx.tool_results
  - sink.exec
  execution_environment:
    sandbox: Docker sandbox (default network:none, readOnlyRoot, capDrop ALL) or Crabbox lease or UNSANDBOXED
      host if sandbox off
    network_egress: none by default; host network if unsandboxed
    filesystem_scope: agent/sandbox workspace
    enforced_by: platform_config
  effect_class: code_execution
  approval_required: unknown
  control_ids:
  - ctl.sandbox
  - ctl.before_tool_hook
  related_l2_ids: []
  visibility: white_box_required
  reachability:
    status: black_box_reachable
    notes: ''
  evidence_status: source_confirmed
  source_ref: docs/gateway/sandboxing/docker-backend.md; agent-loop tool execution
  notes: Arbitrary command execution; isolation depends on sandbox config -> UNSANDBOXED host runs = full
    RCE.
