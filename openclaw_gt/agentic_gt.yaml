schema_version: agentic-attack-surface-v1
environment_id: openclaw-oss
meta:
  app: openclaw
  app_version: repo @ 472-new checkout
  git_ref: see source_root
  applicability:
    verdict: qualifies
    evidence: multi-agent gateway running coding-agent loops (packages/agent-core/src/agent-loop.ts, built-in or external
      runtimes) over terminal/file/web/computer/MCP/subagent/A2A tools, driven by messaging channels (src/channels/*), gateway
      RPC, A2A, and a cron scheduler (src/cron/*).
  phase_status:
    static_A_to_D: complete (CODE-GROUNDED; source_ref cites src/ + packages/ symbols)
    runtime_E: 'performed offline: reachability set from source gating + per-record grounding runbook written; live ''observed''
      upgrade blocked (no network/docker/model provider in this environment) -- see environment.yaml runtime_grounding_plan
      + annotation issue phase-e-offline. No record is marked ''observed''.'
    link_F: complete (../l1_gt.yaml + ../l2_gt.yaml built via build_links.py; all cross-layer l1/l2 references resolved and
      enforced below)
agents:
- id: agent.openclaw.primary
  name: Fleet agent (per channel/role)
  component: openclaw
  agent_kind: interactive
  purpose: An agent entry in the fleet; runs the agent-core loop (packages/agent-core/src/agent-loop.ts, built-in or external
    runtime) over terminal/file/web/computer/MCP/skill tools, reachable via messaging channels, gateway RPC, A2A, and the
    cron scheduler.
  invocation_surfaces:
  - l1_id: l1.channel.whatsapp
    trigger: inbound WhatsApp DM/group message (dmPolicy pairing/allowlist)
    auth_context: channel identity gated by DM allowlist; bound agent
  - l1_id: l1.channel.feishu
    trigger: inbound Feishu/Slack/other channel message
    auth_context: channel account; agent binding
  - l1_id: l1.gateway.rpc
    trigger: Gateway RPC / Control UI talk
    auth_context: operator/owner
  - l1_id: l1.a2a.inbound
    trigger: agent-to-agent message from a peer agent
    auth_context: tools.agentToAgent allow policy
  - l1_id: l1.cron.scheduled
    trigger: cron/scheduled self-triggered turn
    auth_context: job creator identity; creator cap
  model_config:
    provider: configurable per agentRuntime (claude-cli/codex/copilot/muse/openclaw)
    model: provider/model runtime policy
    config_source: agents.defaults + agents.entries.* (operator)
    writers:
    - principal: operator
      l1_id: l1.config.agents
    - principal: plugin
      l1_id: l1.plugin.hook
    evidence_status: source_confirmed
  instruction_sources:
  - surface_id: ctx.system_prompt
    instruction_role: system
    precedence: base
    config_version: runtime
    writers:
    - principal: operator
      l1_id: l1.config.agents
  - surface_id: ctx.skill_instructions
    instruction_role: developer
    precedence: injected
    config_version: runtime
    writers:
    - principal: operator
      l1_id: l1.workspace.skills
    - principal: agent
      l1_id: null
  - surface_id: ctx.plugin_injected
    instruction_role: system
    precedence: injected
    config_version: runtime
    writers:
    - principal: plugin
      l1_id: l1.plugin.hook
  tool_binding_ids:
  - tool.primary.terminal
  - tool.primary.file_read
  - tool.primary.apply_patch
  - tool.primary.web_fetch
  - tool.primary.web_search
  - tool.primary.computer
  - tool.primary.message
  - tool.primary.sessions_send
  - tool.primary.sessions_spawn
  - tool.primary.sessions_read
  - tool.primary.cron
  - tool.primary.ask_user
  - tool.primary.mcp
  - tool.primary.skills
  - tool.primary.github
  - tool.primary.media
  - tool.primary.gateway
  context_source_ids:
  - ctx.system_prompt
  - ctx.skill_instructions
  - ctx.plugin_injected
  - ctx.channel_message
  - ctx.session_history
  - ctx.tool_results
  - ctx.web_content
  - ctx.tool_descriptions
  - ctx.subagent_task
  - ctx.cross_agent_message
  - ctx.cron_prompt
  - ctx.ask_user_response
  memory_ids:
  - mem.sessions
  - mem.workspace
  - mem.skills
  - mem.fleet_config
  - mem.cron_jobs
  output_sink_ids:
  - sink.channel_reply
  - sink.exec
  - sink.web_egress
  - sink.file_write
  - sink.agent_send
  - sink.mcp_call
  - sink.github
  - sink.media
  - sink.cron_schedule
  control_ids:
  - ctl.sandbox
  - ctl.before_tool_hook
  - ctl.dm_allowlist
  - ctl.agent_to_agent
  - ctl.skill_allowlist
  - ctl.owner_trust
  - ctl.tool_arg_validation
  - ctl.session_visibility
  - ctl.exec_approval
  - ctl.net_policy_ssrf
  - ctl.requester_tool_policy
  - ctl.cron_creator_cap
  resource_limits:
    max_iterations: turn/attempt scoped; model attempt timeout aborts a stuck attempt
    recursion: subagent spawn depth + child limits (sessions-spawn)
    token_or_cost_budget: global capacity + per-turn (agent-loop steering)
    loop_detection: assistant-repetition-guard.ts + repetition-guard.ts; session serialization
    enforced_by: code
  authority_context:
    principal_source: messaging-channel sender (gated) or operator
    tenant_scope: per-agent workspace/session; fleet isolation
    resource_scope: agent workspace + sandbox; channel account; allowed peer agents
    delegated_identity: tools run in the agent's workspace/sandbox; messaging under the channel account
    authz_enforcement: code/config (DM allowlist + agentToAgent allow + requester tool policy + skill allowlist + sandbox
      + before_tool_call hook)
  related_l2_ids:
  - l2.agent.channel_run
  - l2.agent.scheduled_run
  visibility: white_box_required
  reachability:
    status: black_box_reachable
    notes: ''
  source_ref: packages/agent-core/src/agent-loop.ts; agent-loop-tool-execution.ts; src/agents/* (embedded-agent-runner, cli-runner);
    src/channels/* (inbound-event); src/cron/*
  evidence_status: observed
  notes: 'Untrusted entry is a channel message (or A2A/cron prompt): anyone who passes the DM allowlist can drive the agent
    + its tools. The core attack surface | RUNTIME 2026-11-20: observed via `openclaw agent --local` on local qwen2.5 (num_ctx
    32768). Tools executed: terminal (echo), apply_patch (file write), file_read; web_fetch invoked and BLOCKED by the SSRF
    net-policy before-tool hook (''[security] blocked URL fetch ... private/internal IP'').'
- id: agent.openclaw.subagent
  name: Sub-agent (background spawn)
  component: openclaw
  agent_kind: specialist
  purpose: Background run spawned from a parent (sessions_spawn / subagents-tool), session-separated, with a deliberately
    restricted tool surface (no session/message/spawn tools by default).
  invocation_surfaces:
  - l1_id: l1.internal.subagent_spawn
    trigger: sessions_spawn / subagents tool
    auth_context: parent agent; allowAgents + spawn limits
  model_config:
    provider: agents.defaults.subagents.model or per-agent override
    model: subagent model
    config_source: subagents config
    writers:
    - principal: operator
      l1_id: l1.config.agents
    evidence_status: source_confirmed
  instruction_sources:
  - surface_id: ctx.subagent_task
    instruction_role: developer
    precedence: base
    config_version: runtime
    writers:
    - principal: agent.openclaw.primary
      l1_id: null
  tool_binding_ids:
  - tool.subagent.terminal
  - tool.subagent.file_read
  - tool.subagent.apply_patch
  - tool.subagent.web_fetch
  - tool.subagent.computer
  - tool.subagent.mcp
  context_source_ids:
  - ctx.subagent_task
  - ctx.tool_results
  - ctx.web_content
  memory_ids:
  - mem.sessions
  - mem.workspace
  output_sink_ids:
  - sink.exec
  - sink.web_egress
  - sink.file_write
  - sink.subagent_result
  control_ids:
  - ctl.sandbox
  - ctl.before_tool_hook
  - ctl.subagent_policy
  - ctl.net_policy_ssrf
  - ctl.requester_tool_policy
  resource_limits:
    max_iterations: turn/attempt scoped
    recursion: own spawn depth/child limits still govern
    token_or_cost_budget: subagent model budget
    loop_detection: lifecycle owner
    enforced_by: code
  authority_context:
    principal_source: parent agent (inherited sender)
    tenant_scope: separate session; optional separate sandbox
    resource_scope: 'restricted: no session/message/spawn tools by default'
    delegated_identity: inherited sender + sandbox/channel restrictions
    authz_enforcement: code (tools.subagents.tools denylist; allowAgents; spawn limits)
  related_l2_ids:
  - l2.agent.subagent_delegation
  visibility: white_box_required
  reachability:
    status: black_box_reachable
    notes: ''
  source_ref: src/agents/tools/subagents-tool.ts; sessions-spawn-tool.ts; sessions-spawn-access-program.ts; delegated-tool-policy.ts
  evidence_status: source_confirmed
  notes: Hidden subagents get the restrictive tool denies; visible spawned sessions are interactive and get message/session
    tools.
  runtime_blocker: local_not_driven
- id: agent.openclaw.system
  name: System agent (ring-zero)
  component: openclaw
  agent_kind: other
  purpose: Privileged system/owner agent governing fleet creation, onboarding, and owner-trust decisions (system-agent-tool).
  invocation_surfaces:
