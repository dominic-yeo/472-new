    field: user / LdapUsername(identity)
    disposition: object_attribute
    facts: []
    ignored_reason: LDAP login name.
  - direction: input
    field: password / Password(credential)
    disposition: object_attribute
    facts: []
    ignored_reason: LDAP password.
  - direction: output
    field: token / SessionToken(credential)
    disposition: gen
    facts:
    - Know(actor:User[SELF],SessionToken(session:Session{target}))
    ignored_reason: ''
  l1_bindings:
  - l1_key: http://localhost/api/v1/auths/ldap
    methods:
    - POST
    selector:
      field: ''
      values: []
  confidence: 0.9
  reasoning: Authentication boundary; LDAP filter chars escaped.
  l1_keys:
  - http://localhost/api/v1/auths/ldap
  consumes:
  - Know(actor:User[SELF],LdapCredential(ldap_account:LdapAccount{target}))
  produces:
