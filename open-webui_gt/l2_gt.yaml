- id: gt-action-005
  name: Sign in via LDAP
  kind: normal
  description: An anonymous caller authenticates against the configured LDAP directory and obtains a session.
  action_key: owui_ldap_signin
  subject:
    id: actor
    identity: Anonymous
    role: Public
    auth_context: None
  operation:
    business: ldap_auth
    crud: Create
  object:
    kind: state
    id: session
    type: Session
    name: Session
    entity: Session
    role: target
    attribute: ''
    state_field: ''
    binding:
      source: implicit
      field: ''
      resource: ''
    participants:
    - id: ldap_account
      type: LdapAccount
      role: target
      binding: {}
    constraints: []
  requirements:
  - type: knowledge
    fact:
      predicate: Know
      arguments:
      - *id001
      - kind: reference
        type: LdapCredential
        target:
          kind: entity
          id: ldap_account
          type: LdapAccount
          role: target
    reason: Caller must present valid LDAP bind credentials.
  effects:
    gen:
    - fact: &id005
        predicate: Authenticated
        arguments:
        - *id001
        - Session
      basis: auth_transition
      reason: A session is established on successful LDAP bind.
    - fact: &id006
        predicate: Know
        arguments:
        - *id001
