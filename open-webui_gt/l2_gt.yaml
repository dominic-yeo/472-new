schema_version: pengent-web-gt-v1
environment_id: open-webui-local
scope: 'Open WebUI 0.13.3 HTTP API -- module: Authentication + Account (/api/v1/auths)'
nodes:
- id: gt-action-001
  name: Read own session
  kind: normal
  description: An authenticated user reads their own session info and receives a refreshed token.
  action_key: owui_get_session_user
  subject:
    id: actor
    identity: AuthenticatedUser
    role: Member
    auth_context: Session
  operation:
    business: get_session_user
    crud: Read
  object:
    kind: entity
    id: self
    type: User
    name: User
    entity: User
    role: target
    attribute: ''
    state_field: ''
    binding:
      source: implicit
      field: ''
      resource: ''
    participants:
    - id: session
      type: Session
      role: target
      binding: {}
    constraints: []
  requirements:
  - &id002
    type: authentication
    fact:
      predicate: Authenticated
      arguments:
      - &id001
        kind: subject
        id: actor
        type: User
        relative_role: SELF
      - Session
    reason: get_current_user resolves the JWT token / API key.
  effects:
    gen:
    - fact:
        predicate: Know
        arguments:
        - *id001
        - kind: reference
          type: SessionToken
          target: &id004
            kind: entity
            id: session
            type: Session
            role: target
      basis: io_reference
      reason: Response returns a freshly re-issued session token.
    - fact:
        predicate: Know
        arguments:
        - *id001
        - kind: reference
          type: Permissions
          target: &id003
            kind: entity
            id: self
            type: User
            role: target
      basis: io_reference
      reason: Response returns the caller's effective permission map.
    kill: []
  io_accounting:
  - direction: output
    field: token / SessionToken(credential)
    disposition: gen
    facts:
    - Know(actor:User[SELF],SessionToken(session:Session{target}))
    ignored_reason: ''
  - direction: output
    field: permissions / Permissions(authz)
    disposition: gen
    facts:
    - Know(actor:User[SELF],Permissions(self:User{target}))
    ignored_reason: ''
  - direction: output
    field: role / UserRole(authz)
    disposition: observed_only
    facts: []
    ignored_reason: Caller's own role, echoed.
  l1_bindings:
  - l1_key: http://localhost/api/v1/auths/
    methods:
    - GET
    selector:
      field: ''
      values: []
  confidence: 0.95
  reasoning: Self-scoped read that also rotates the session token.
  l1_keys:
  - http://localhost/api/v1/auths/
  consumes:
  - Authenticated(actor:User[SELF],Session)
  produces:
  - Know(actor:User[SELF],SessionToken(session:Session{target}))
  - Know(actor:User[SELF],Permissions(self:User{target}))
  object_type: entity
  lifecycle: ''
  operations: []
  secondary_objects: []
  gt:
    visibility:
      minimum: black_box
      reason: Any authenticated caller reads their own session.
    black_box_reachable: true
    reachability_conditions:
    - Valid session token or API key
    observable_evidence: []
    evidence:
    - type: source
      ref: backend/open_webui/routers/auths.py:185
      supports: GET / [get_current_user] -> SessionUserInfoResponse; re-issues token
    - type: runtime
      ref: '2026-11-20: bound L1 interface(s) observed at runtime (/api/v1/auths/)'
      supports: 'runtime: bound interface observed per identity; interface-observed, not effect-observed'
    notes: Discloses caller role + effective permissions; re-issues a token on every call.
- id: gt-action-002
  name: Update own profile
  kind: normal
  description: A verified user updates their own display name, avatar and bio.
  action_key: owui_update_profile
  subject:
    id: actor
    identity: VerifiedUser
    role: Member
    auth_context: Session
  operation:
    business: update_profile
    crud: Update
  object:
    kind: entity
    id: self
    type: User
    name: User
    entity: User
    role: target
    attribute: ''
    state_field: ''
    binding:
      source: request
      field: name
      resource: DisplayName(identity)
    participants:
    - id: instance
      type: Instance
      role: authority
      binding: {}
    constraints: []
  requirements:
  - *id002
  - &id007
    type: authorization
    fact:
      predicate: Can
      arguments:
      - *id001
      - Use
      - &id009
        kind: entity
        id: instance
        type: Instance
        role: authority
    reason: get_verified_user requires a non-pending role.
  effects:
    gen:
    - fact:
        predicate: State
        arguments:
        - *id003
        - name
        - updated
      basis: state_transition
      reason: Display name is replaced.
    - fact:
        predicate: State
        arguments:
        - *id003
        - profile_image_url
        - updated
      basis: state_transition
      reason: Profile image URL is replaced.
    kill: []
  io_accounting:
  - direction: input
    field: name / DisplayName(identity)
    disposition: object_attribute
    facts: []
    ignored_reason: New display name.
  - direction: input
    field: profile_image_url / ProfileImage(identity)
    disposition: object_attribute
    facts: []
    ignored_reason: New avatar URL (validate_image_url).
  - direction: input
    field: bio / Bio(identity)
    disposition: object_attribute
    facts: []
    ignored_reason: Free-text bio.
  - direction: output
    field: name / DisplayName(identity)
    disposition: gen
    facts:
    - State(self:User{target},name,updated)
    ignored_reason: ''
  - direction: output
    field: profile_image_url / ProfileImage(identity)
    disposition: gen
    facts:
    - State(self:User{target},profile_image_url,updated)
    ignored_reason: ''
  l1_bindings:
  - l1_key: http://localhost/api/v1/auths/update/profile
    methods:
    - POST
    selector:
      field: ''
      values: []
  confidence: 0.95
  reasoning: Self profile write; name/bio are stored and reflected.
  l1_keys:
  - http://localhost/api/v1/auths/update/profile
  consumes:
  - Authenticated(actor:User[SELF],Session)
  - Can(actor:User[SELF],Use,instance:Instance{authority})
  produces:
  - State(self:User{target},name,updated)
  - State(self:User{target},profile_image_url,updated)
  object_type: entity
  lifecycle: ''
  operations: []
  secondary_objects: []
  gt:
    visibility:
      minimum: black_box
      reason: Verified caller edits own profile.
    black_box_reachable: true
    reachability_conditions:
    - Non-pending role
    observable_evidence: []
    evidence:
    - type: source
      ref: backend/open_webui/routers/auths.py:253
      supports: POST /update/profile [get_verified_user] -> UserProfileImageResponse
    - type: runtime
      ref: '2026-11-20: bound L1 interface(s) observed at runtime (/api/v1/auths/update/profile)'
      supports: 'runtime: bound interface observed per identity; interface-observed, not effect-observed'
    notes: name/bio are stored-reflected (self stored-XSS surface); image URL passes validate_image_url.
