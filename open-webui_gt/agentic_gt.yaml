    sandbox: pyodide WASM (default) or external Jupyter kernel
    network_egress: 'pyodide: via proxy; jupyter: kernel host network (unrestricted)'
    filesystem_scope: 'jupyter: kernel container FS'
    enforced_by: platform_config
  effect_class: code_execution
