  - run arbitrary Python
  execution_identity:
    identity: pyodide sandbox OR shared Jupyter token
    credential_source: CODE_INTERPRETER_JUPYTER_AUTH token in server config
  argument_handling: &id001
    validation: JSON parse + depth<=32 + 64KiB literal cap (tool_calling.normalize_arguments)
    authorization: per-user feature permission + model capability + global flag
    normalization: schema coercion
    enforced_by: code
  output_ids:
  - ctx.tool_results
  - sink.code_exec
