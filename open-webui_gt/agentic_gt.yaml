schema_version: agentic-attack-surface-v1
environment_id: open-webui-oss
meta:
  app: open-webui
  app_version: 0.13.3
  git_ref: b0e6098
  applicability:
    verdict: qualifies
    evidence: native tool-calling loop (utils/middleware.py) over a tool registry (utils/tools.py get_tools/get_builtin_tools)
      with model-selected dispatch and result feedback; sub-agents (utils/subagents.py).
  phase_status:
    static_A_to_D: complete
    runtime_E: pending (no live grounding yet)
    link_F: partial (L1/L2 GT for open-webui not yet built; ids referenced are forward refs)
agents:
- id: agent.openwebui.primary
  name: Primary chat agent
  component: open-webui
  agent_kind: interactive
  purpose: User-facing assistant that runs a native tool-calling loop over the selected model and the enabled builtin/workspace/MCP/terminal
    tools.
  invocation_surfaces:
  - l1_id: l1.api.chat.completions
    trigger: POST /api/chat/completions (and /api/.../completions)
    auth_context: session JWT or API key -> UserModel
  - l1_id: l1.api.chat.completed
    trigger: resume after tool-call approval (/api/chat/completed, tool resolve)
    auth_context: same user; write access to chat
  model_config:
    provider: configurable (OpenAI-compatible / Ollama / Azure / Anthropic via pipelines)
    model: per-chat model_id
    deployment: self-hosted
    config_source: Models workspace + connection config (admin)
    writers:
    - principal: admin
      l1_id: l1.api.models.config
    - principal: user
      l1_id: l1.api.chats.params
    evidence_status: source_confirmed
  instruction_sources:
  - surface_id: ctx.system_prompt
    instruction_role: system
    precedence: base
    config_version: runtime
    writers:
    - principal: user
      l1_id: l1.api.users.settings
    - principal: admin
      l1_id: l1.api.configs.default_settings
  - surface_id: ctx.tool_approval_policy
    instruction_role: system
    precedence: appended
    config_version: runtime
    writers:
    - principal: admin
      l1_id: l1.api.configs.tool_permissions
  - surface_id: ctx.skill_instructions
    instruction_role: developer
    precedence: injected
    config_version: runtime
    writers:
    - principal: user
      l1_id: l1.api.skills.update
    - principal: admin
      l1_id: l1.api.skills.update
  tool_binding_ids:
  - tool.primary.code_interpreter
  - tool.primary.web
  - tool.primary.image
  - tool.primary.memory
  - tool.primary.knowledge_rag
  - tool.primary.files
  - tool.primary.notes
  - tool.primary.chats
  - tool.primary.channels
  - tool.primary.calendar
  - tool.primary.automations
  - tool.primary.notify
  - tool.primary.tasks
  - tool.primary.skills
  - tool.primary.create_skill
  - tool.primary.create_tool
  - tool.primary.subagents
  - tool.primary.ask_user
  - tool.primary.workspace_python
  - tool.primary.tool_server
  - tool.primary.mcp
  - tool.primary.terminal
  context_source_ids:
  - ctx.system_prompt
  - ctx.user_message
  - ctx.chat_history
  - ctx.rag_knowledge
  - ctx.tool_results
  - ctx.web_content
  - ctx.memory_recall
  - ctx.files_attached
  - ctx.skill_instructions
  - ctx.tool_descriptions
  - ctx.terminal_system_prompt
  - ctx.tool_approval_policy
  - ctx.mcp_resource
  memory_ids:
  - mem.memories
  - mem.chat_history
  - mem.knowledge_vector
  - mem.notes
  - mem.skills
  - mem.tasks
  - mem.automations
  output_sink_ids:
  - sink.chat_stream
  - sink.notify
  - sink.image_gen
  - sink.external_tool_call
  - sink.code_exec
  - sink.terminal
  control_ids:
  - ctl.tool_approval
  - ctl.tool_permissions_auto
  - ctl.tool_permission_rbac
  - ctl.pipeline_inlet_filter
  - ctl.pipeline_outlet_filter
  - ctl.function_filters
  - ctl.arg_validation
  - ctl.tool_repetition_guard
  - ctl.untrusted_data_prompt
  resource_limits:
    max_iterations: model-driven loop; per-request, no hard global cap found (tool_repetition_guard stops 2x-failed repeats
      only)
    recursion: sub-agents cannot spawn sub-agents (internal request strips delegate_task)
    token_or_cost_budget: none in core (provider-side only)
    loop_detection: tool_repetition_error (name+args, 2 consecutive failures)
    enforced_by: code
  authority_context:
    principal_source: session JWT / API key -> UserModel
    tenant_scope: single-tenant; per-user isolation
    resource_scope: user's own chats/files/memories unless shared KB/model
    delegated_identity: builtin tools act AS the user via extra_params.__user__
    authz_enforcement: code (has_permission over user.permissions + RBAC groups)
  related_l2_ids:
  - l2.chat.completion
  visibility: white_box_required
  reachability:
    status: black_box_reachable
    notes: ''
  source_ref: utils/middleware.py:process_chat_payload/process_chat_response; utils/tools.py:get_tools/get_builtin_tools
  evidence_status: observed
  notes: 'Builtin tool set is gated by (global config) AND (model capability meta) AND (per-user permission) AND (feature
    flag) -- most tools are conditionally_mounted | RUNTIME 2026-11-20: observed via Open WebUI socket.io chat on local qwen2.5:7b
    -- model natively invoked add_memory, search_memories, execute_code, create_tasks, create_automation, create_calendar_event,
    search_chats, search_knowledge_bases, ask_user (response.output_item function_call events); 40-tool builtin spec confirmed
    sent to the model. Tool invocation observed; server-side execution/effects need the full UI client.'
- id: agent.openwebui.subagent
  name: Delegated sub-agent
  component: open-webui
  agent_kind: specialist
  purpose: Isolated task worker spawned by delegate_task; runs its own tool loop with an internal request, inheriting the
    parent's tools minus mutating-memory tools.
  invocation_surfaces:
  - l1_id: l1.internal.subagent
    trigger: builtin delegate_task (foreground or background)
    auth_context: internal request built from parent user_data; request.state.internal=True
  model_config:
    provider: inherits parent
    model: parent model or chosen subagent model
    config_source: subagents config + parent metadata
    writers: []
    evidence_status: source_confirmed
  instruction_sources:
  - surface_id: ctx.delegated_task
    instruction_role: developer
    precedence: base
    config_version: runtime
    writers:
    - principal: agent.openwebui.primary
      l1_id: null
  - surface_id: ctx.subagent_system_prompt
    instruction_role: system
    precedence: base
    config_version: runtime
    writers:
    - principal: admin
      l1_id: l1.api.configs.subagents
  tool_binding_ids:
  - tool.primary.knowledge_rag
  - tool.primary.web
  - tool.primary.code_interpreter
  - tool.primary.files
  context_source_ids:
  - ctx.delegated_task
  - ctx.subagent_system_prompt
  - ctx.tool_results
  - ctx.rag_knowledge
  - ctx.web_content
  memory_ids:
  - mem.chat_history
  - mem.knowledge_vector
  output_sink_ids:
  - sink.delegated_result
  control_ids:
  - ctl.subagent_limits
  - ctl.internal_memory_strip
  resource_limits:
    max_iterations: subagents.max_iterations (config)
    recursion: no nested sub-agents
    token_or_cost_budget: subagents.max_output
    loop_detection: inherits
    enforced_by: code
  authority_context:
    principal_source: parent user identity (user_data)
    tenant_scope: same user as parent
    resource_scope: parent's tool_ids/files/KB
    delegated_identity: acts as the parent user; background runs drop tool_servers
    authz_enforcement: code (inherits parent permissions; MUTATING_MEMORY_TOOLS removed)
  related_l2_ids:
  - l2.chat.completion
  visibility: white_box_required
  reachability:
    status: black_box_reachable
    notes: ''
  source_ref: utils/subagents.py:delegate/process_pending_internal_messages
  evidence_status: source_confirmed
  notes: Background sub-agents additionally drop non-jupyter code_interpreter and tool_servers.
  runtime_blocker: local_not_driven
- id: agent.openwebui.terminal
  name: Terminal / ACP coding agent
  component: open-webui
  agent_kind: specialist
  purpose: External coding agent reached over a terminal server using ACP v1 (JSONL carrier); Open WebUI brokers prompts/approvals
    to it.
  invocation_surfaces:
  - l1_id: l1.api.terminal
    trigger: terminal_id on a chat; get_terminal_tools
    auth_context: user session; terminal server connection config
  model_config:
    provider: external ACP agent (out of process)
    model: agent-defined
    config_source: terminal server connection (admin)
    writers:
    - principal: admin
      l1_id: l1.api.configs.terminal_servers
    evidence_status: source_confirmed
  instruction_sources:
  - surface_id: ctx.terminal_system_prompt
    instruction_role: system
    precedence: base
    config_version: runtime
    writers:
    - principal: external_service
      l1_id: null
  tool_binding_ids:
  - tool.primary.terminal
  context_source_ids:
  - ctx.terminal_system_prompt
  - ctx.user_message
  memory_ids:
  - mem.chat_history
  output_sink_ids:
  - sink.terminal
  - sink.chat_stream
  control_ids:
  - ctl.ask_user_hitl
  - ctl.tool_approval
  resource_limits: null
  authority_context:
    principal_source: terminal server identity
    tenant_scope: terminal working directory
    resource_scope: terminal filesystem/shell
    delegated_identity: terminal server's own identity/credentials
    authz_enforcement: external (delegated to terminal server)
  related_l2_ids: []
  visibility: white_box_required
  reachability:
    status: conditionally_mounted
    notes: requires a configured terminal server (ENABLE_TOOL_SERVERS)
  source_ref: utils/agents/acp.py; utils/tools.py:get_terminal_tools/get_terminal_system_prompt
  evidence_status: source_confirmed
  notes: ctx.terminal_system_prompt is supplied by the EXTERNAL terminal server into the system channel.
  runtime_blocker: local_not_driven
- id: agent.openwebui.task_utility
  name: Task/utility model
  component: open-webui
  agent_kind: reviewer
  purpose: Side LLM calls for titles/tags/autocomplete, tool selection, after-turn memory review, and the auto tool-approval
    'decisions' judgment.
  invocation_surfaces:
  - l1_id: l1.api.tasks
    trigger: internal task pipeline + decisions engine
    auth_context: user context; task model config
  model_config:
    provider: configurable task model
    model: task.model config
    config_source: admin task config
    writers:
    - principal: admin
      l1_id: l1.api.configs.task
    evidence_status: source_confirmed
  instruction_sources:
  - surface_id: ctx.task_prompt_templates
    instruction_role: system
    precedence: base
    config_version: runtime
    writers:
    - principal: admin
      l1_id: l1.api.configs.task
  tool_binding_ids: []
  context_source_ids:
  - ctx.user_message
  - ctx.chat_history
  - ctx.tool_results
  - ctx.memory_recall
  memory_ids:
  - mem.memories
  - mem.chat_history
  output_sink_ids:
  - sink.memory_write
  control_ids:
  - ctl.untrusted_data_prompt
  resource_limits: null
  authority_context:
    principal_source: originating user
    tenant_scope: same user
    resource_scope: that user's memories/chat
    delegated_identity: runs as the user
    authz_enforcement: code
  related_l2_ids:
  - l2.chat.completion
  visibility: white_box_required
  reachability:
    status: black_box_reachable
    notes: ''
  source_ref: utils/memory.py:review_memory_after_turn/_generate_memory_operations; utils/tool_permissions.py:review_with_decisions
  evidence_status: source_confirmed
  notes: review_with_decisions treats only user messages as authorization; tool output/retrieved content explicitly flagged
    non-authorizing (prompt-level).
  runtime_blocker: local_not_driven
